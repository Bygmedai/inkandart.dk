# Aftercare — det vi selv siger i stolen. Flyttet fra lib/aftercare.ts til
# YAML (S574) af to grunde: plejeråd skal kunne rettes af dem der giver
# dem, uden en PR — og siden skal kunne tales på engelsk.
# Teksten er flyttet ordret. Ret den frit i Decap.

file: Pas på det
titel: Aftercare
lead: >-
  Din tatovering og piercing skal passes de første uger — så holder linjerne og smykket sidder rigtigt. Her er det vi selv siger i stolen.
tattoo_titel: Tatovering
piercing_titel: Piercing
tattoo:
  - t: De første timer
    d: >-
      Lad folien sidde 2–4 timer. Vask så forsigtigt med rene hænder, lunkent vand og parfumefri sæbe. Dup tør med rent stof.
  - t: Dag 1–14
    d: >-
      Et tyndt lag uparfumeret salve 2–3 gange om dagen. Lad den ånde — pak den ikke ind. Pil aldrig skorper eller flager af.
  - t: Undgå
    d: >-
      Sol, solarium, bassin, sauna og hav i 2–3 uger. Klor, salt og bakterier kan ødelægge linjerne mens den heler.
  - t: Fine linjer holder
    d: >-
      Jo roligere du heler, jo skarpere bliver de fine linjer på den lange bane. Hold huden fugtet og lad være med at klø.
piercing:
  - t: Rengøring
    d: >-
      Skyl 1–2 gange dagligt med steril saltvand. Rør den ellers så lidt som muligt — altid rene hænder.
  - t: De første uger
    d: >-
      Skift ikke smykket for tidligt, og drej det ikke. Sov uden tryk på den, og hold hår, makeup og creme væk.
  - t: Tålmodighed
    d: >-
      Bassin, sauna og hav venter til den er helet. Det tager tid — brusk og septum længst. Det er normalt.
tvivl_label: I tvivl?
tvivl: >-
  Er du i tvivl — om en skorpe, en rødme, et smykke der strammer — så skriv. Vi svarer hellere på ét spørgsmål for meget end at du går og er nervøs.
skriv_cta: Skriv på WhatsApp
