# Nattens egen side. Sonja retter her — ikke i koden.
# intro: hvad Natten ER, for en der aldrig har hørt om den.
#
# LÆS DETTE FØR DU SKRIVER HER (11/9 2026, Nizars kald):
# Udlejeren, Semper Ejendomme, skrev til Nizar fordi siden reklamerede
# med «en aften med DJ, drinks og flash-tattoos». Høj musik er ikke
# tilladt i lejemålet, og udskænkning af spiritus kræver en bevilling
# huset ikke har. Nizar: «Du må meget gerne fjerne det fra hjemmesiden.»
#
# Aftener på Larsbjørnsstræde 13 handler derfor om ÉT: at der bliver
# tatoveret, når resten af byen har lukket. Det er det huset har lov til,
# og det er også det eneste i byen. Skriv ikke DJ, drinks, bar, musik
# eller fest ind her igen — tests/udlejer-krav.test.mjs går rød.
#
# (Chateau-siden er en ANDEN adresse med en anden udlejer og en anden
# bevilling. Den er ikke omfattet.)

intro: >-
  Flash-tattoos i kælderen, når huset holder åbent til natten.
  Næste dato annonceres her og til alle, der har skrevet sig op.
tom_titel: Ingen nat i aften
tom_linje: Skriv dig op — så får du besked når den næste kommer.

# Nattespot — den holdte plads. Villy, S574 (Stevens kald 30/8 «Sælg natten»).
# [ORD-TJEK Steven 30/8] — udkast. Natten er husets stemme, ikke min. Ret frit.
# Beløbet står IKKE her: det kommer fra NATTESPOT i lib/commerce.ts, så
# siden og Shopify aldrig kan sige to forskellige tal.
spot_titel: Walk-in om natten
spot_linje: >-
  Torsdag, fredag og lørdag har vi åbent efter kl. 22, når resten af byen
  har lukket. Hold en plads i stolen — begrænset antal pr. nat.
spot_vilkaar: >-
  Depositummet trækkes fra prisen. Resten aftaler vi i studiet, når vi
  har set motivet sammen.
spot_koeb: Hold en plads
