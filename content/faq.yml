# FAQ — bygget af betingelserne og husets fakta (H5, Stevens go 30/8).
# Ét spørgsmål, ét svar. Sonja retter her.

titel: FAQ
lede: Det vi oftest bliver spurgt om — ved disken og i indbakken.

sporgsmal:
  - q: Hvad koster en tatovering?
    a: >-
      Prisen aftales med din artist ud fra motiv, størrelse og
      placering — et motiv har én fast pris. Ingen timepris, ingen
      overraskelser.
  - q: Kan jeg bare komme forbi?
    a: >-
      Ja. Walk-in når der er en fri stol — tirsdag til lørdag
      kl. 10–05.30. Vil du være sikker på en tid, så book.
  - q: Hvordan booker jeg?
    a: >-
      Betal depositum (fra 100 kr) på bookingsiden og vælg din tid.
      Depositummet fragår i prisen.
  - q: Kan jeg ombooke?
    a: >-
      Ja — ombook senest 48 timer før din tid, så følger depositummet
      med til den nye. Senere afbud eller udeblivelse koster
      depositummet.
  - q: Hvad med store motiver?
    a: >-
      Store motiver starter med en gratis og uforpligtende
      konsultation. Ring, eller kom forbi og tag snakken ved disken.
  - q: Hvor gammel skal jeg være?
    a: >-
      18 år for tatovering — det er dansk lov, og vi beder om
      billed-ID ved tvivl. Piercing under 18 kræver en forælder med i
      butikken.
  - q: Hvad koster en piercing?
    a: >-
      Efter aftale — ring, eller kom ned i butikken. Vi sælger også
      smykker over disken.
  - q: Er touch-up med i prisen?
    a: >-
      Touch-up på tatovering er gratis inden for 3 måneder, efter
      aftale. Derefter aftales pris med artisten.
  - q: Hvordan fungerer gavekort?
    a: >-
      Købt online leveres koden pr. mail med det samme. Gyldigt i 3 år,
      til tatovering, piercing og varer i butikken.
  - q: Hvor ligger I?
    a: >-
      Larsbjørnsstræde 13, kælderen — midt i Pisserenden, 1454
      København K.
