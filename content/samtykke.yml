# Samtykkeerklæringen. Ordene her — ikke i komponenten.
#
# Formen er Simones (Fra Simone, 31/8). Rettes frit; felterne selv bor i
# lib/samtykke.ts, fordi de skal prøves.
#
# ORDENE ER DANSKE. Filen blev første gang skrevet med aa/oe/ae — det er
# en vane fra kildekode, og den sivede ud i den tekst kunden skriver under
# på. Villy fandt den live 1/9. Der er en vagt på det nu.

titel: Samtykke
lede: >-
  Udfyld den her, før du kommer. Så bruger vi din tid i stolen på
  arbejdet i stedet for på papir. Tager det to minutter hjemmefra, tager
  det ti hernede.
dig: Dig
dit_navn: Fulde navn
foedselsdato: Fødselsdato
email: Email
telefon: Telefon
arbejdet: Arbejdet
kunstner: Kunstner
aftale_dato: Hvornår er din tid
aftale_hint: >-
  Datoen står i din bookingbekræftelse. Den bruger vi til at lægge
  erklæringen på den rigtige dag.
placering: Hvor på kroppen
motiv: Hvad skal det være
motiv_hint: Beskriv det med dine egne ord. Hvad du tænker, hvad det skal sige.
stoerrelse: Hvor stort
stoerrelse_valg:
  - { id: lille, tekst: Mindre end en håndflade }
  - { id: mellem, tekst: Mellem en håndflade og en underarm }
  - { id: stor, tekst: Større end en underarm }
farve: Farve eller sort
farve_valg:
  - { id: sort, tekst: Sort blæk }
  - { id: farve, tekst: Farver }
helbred: Helbred
helbred_lede: >-
  Kryds af hvis noget af det her gælder dig. Det bliver mellem os og din
  kunstner, og det ændrer kun hvordan vi griber det an.
helbred_valg:
  - { id: gravid, tekst: Jeg er gravid eller ammer }
  - { id: blodfortyndende, tekst: Jeg tager blodfortyndende medicin }
  - { id: allergi, tekst: Jeg har allergi over for blæk eller latex }
  - { id: hudlidelse, tekst: Jeg har en hudlidelse eller følsom hud }
  - { id: andet, tekst: Andet der kan have betydning }
helbred_note: Vil du uddybe?
erklaering: Erklæring
erklaering_valg:
  - { id: atten, tekst: Jeg er fyldt 18 år. }
  - { id: permanent, tekst: Jeg ved at en tatovering er permanent, og at fjernelse er dyrt og efterlader et spor. }
  - { id: aftercare, tekst: Jeg følger den aftercare jeg får med. Det er den der afgør hvordan det heler. }
foto_ok: >-
  I må gerne bruge et billede af det færdige arbejde på væggen og på
  jeres kanaler. Et nej koster ingenting.
send: Send
sender: Sender
tak_titel: Tak
tak: >-
  Vi har den, og en kopi er på vej til din mail. Gem den — så har du selv
  dine egne ord. Du behøver ikke gøre mere; kom bare til din tid.
fejl: >-
  Den blev IKKE sendt. Vi vil hellere sige det end lade som om — så du ved
  at du skal gøre noget. Prøv igen, eller udfyld den hernede når du kommer.
fejl_halvt: >-
  Vi har sandsynligvis modtaget din erklæring — men kopien til dig gik
  ikke igennem. Send den IKKE igen; så får vi den to gange. Skriv til os,
  eller sig det ved disken når du kommer.
fejl_felter: Der mangler noget herover. Se de markerede felter.
print: Print den i stedet
betingelser_linje: Se også husets betingelser.
