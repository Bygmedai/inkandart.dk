titel: Piercing at Ink & Art
tekst: >-
  A piercing is rarely just jewellery. For some it is a celebration — a
  birthday, a goodbye, a new chapter. For others it is the freedom to
  decide over your own body, and for many it is a marker: this is where I
  stand now. We know that down here. So you get calm, clean hands and an
  honest word about what suits you — and what needs to heal first. We sell
  jewellery over the counter, and we are happy to change the ones you
  already wear.

