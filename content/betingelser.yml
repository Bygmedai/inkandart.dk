# Betingelser — godkendt af Steven 30/8 2026. Sonja retter her via Decap.
# Én sektion per punkt: overskrift + tekst.

titel: Betingelser
lede: >-
  Standardvilkår for tatovering, piercing, booking, gavekort og køb hos
  Ink and Art Cph ApS.

sektioner:
  - overskrift: Hvem vi er
    tekst: >-
      Ink and Art Cph ApS · CVR 44226413 · Larsbjørnsstræde 13, kælderen,
      1454 København K · booking@inkandart.dk · 55 24 86 08.

  - overskrift: Booking og depositum
    tekst: >-
      En tid bookes via vores bookingside. Depositum (fra 100 kr) betales
      ved booking og fragår i prisen på din tatovering eller piercing.
      Depositum refunderes ikke, men kan flyttes: ombooker du senest 48
      timer før din tid, følger depositummet med til den nye tid.
      Udebliver du, eller aflyser du senere end det, er depositummet
      tabt — tiden var holdt til dig. Kommer du mere end 15 minutter for
      sent, kan tiden være givet videre, og depositummet anses som tabt.

  - overskrift: Priser
    tekst: >-
      Prisen på en tatovering aftales med din artist ud fra motiv,
      størrelse og placering — et motiv har én fast pris. Walk-in-tilbud
      er skiltet i butikken.

  - overskrift: Aldersgrænser
    tekst: >-
      Tatovering kræver at du er fyldt 18 år — det er dansk lov, og vi
      beder om billed-ID ved tvivl. Piercing under 18 kræver samtykke fra
      en forælder, der er med i butikken.

  - overskrift: Hvad du siger ja til
    tekst: >-
      En tatovering er permanent. Fjernelse er dyrt, gør ondt og efterlader
      næsten altid et spor — regn med at det du får i dag, bliver siddende.
      Undervejs og de første dage efter kan huden være øm, rød og hævet; det
      er normalt. Allergi over for blæk sker sjældent, men det sker.
      Infektion er den ene risiko du selv har hånd om — den kommer næsten
      altid af aftercare der ikke blev fulgt.
  - overskrift: Samtykkeerklæring
    tekst: >-
      Før din tid beder vi dig udfylde en kort erklæring: hvem du er, hvad du
      skal have lavet, og de helbredsforhold der kan have betydning —
      graviditet, blodfortyndende medicin, allergi, hudlidelser. Du kan gøre
      det hjemmefra på inkandart.dk/samtykke, så bruger vi ikke din tid i
      stolen på papir. Har du ikke gjort det, gør vi det i butikken. Vi
      gemmer erklæringen, så længe du er kunde hos os.
  - overskrift: Dit ansvar før vi går i gang
    tekst: >-
      Mød ædru og udhvilet op. Fortæl os om allergier, medicin,
      graviditet eller helbredsforhold der kan have betydning — det
      bliver mellem os. Du følger den aftercare du får med; det er den der
      afgør hvordan det heler. Vi kan afvise at arbejde, hvis vi vurderer det
      ikke er forsvarligt; i så fald flyttes din tid og dit depositum.

  - overskrift: Touch-up
    tekst: >-
      Touch-up på tatovering er gratis inden for 3 måneder efter din
      session, efter aftale — book den som «Touch-up» eller skriv til os.
      Derefter aftales pris med artisten.

  - overskrift: Fortrydelsesret
    tekst: >-
      En booket tid og et påbegyndt eller udført arbejde er en leveret
      tjenesteydelse — fortrydelsesretten efter forbrugeraftaleloven
      bortfalder når arbejdet er udført med dit samtykke. Depositum
      følger reglerne ovenfor. Varer købt i webshoppen (prints, smykker)
      kan fortrydes i 14 dage efter modtagelse; brugte smykker til
      piercing tages ikke retur af hygiejnehensyn.

  - overskrift: Gavekort
    tekst: >-
      Gavekort købt online leveres som kode pr. mail og kan bruges til
      tatovering, piercing og varer i butikken. Gavekort er gyldige i 3
      år fra købsdatoen og kan ikke veksles til kontanter.

  - overskrift: Betaling
    tekst: >-
      Betaling sker i butikken (kort, MobilePay, kontant) eller online
      via Shopify-checkout. Onlinekøb bekræftes pr. mail.

  - overskrift: Aftercare og reklamation
    tekst: >-
      Du får aftercare-vejledning med fra stolen — den står også på
      inkandart.dk/aftercare. Er der noget galt med en vare eller en
      ydelse, så kontakt os på booking@inkandart.dk — købelovens regler
      gælder.

  - overskrift: Hvem der står for hvad
    tekst: >-
      Vi står for arbejdet og for hygiejnen: rene hænder, nye nåle, sterilt
      udstyr, og et resultat vi kan stå inde for. Er der noget galt med det
      vi har lavet, så sig til — vi retter det. Det der sker med huden efter
      du er gået, afhænger af aftercare, og den er din. Følger du den ikke,
      kan vi ikke stå på mål for hvordan det heler.
  - overskrift: Billeder
    tekst: >-
      Vi fotograferer kun dit færdige arbejde til væggen eller vores
      kanaler hvis du siger ja. Du krydser det af på samtykkeerklæringen, det er et
      selvstændigt ja, og du kan trække det tilbage igen ved at skrive til
      booking@inkandart.dk. Et nej koster ingenting.
