# Privatlivspolitik — godkendt af Steven 30/8 2026. Sonja retter her via Decap.
# Skrevet efter oplysningspligten (GDPR art. 13 / Datatilsynets tjekliste for
# små virksomheder). Lov aldrig mere end vi kan holde: står der en databehandler
# her, er det fordi vi bruger den. Kommer der en ny, skal den skrives ind.

titel: Privatlivspolitik
lede: >-
  Hvad vi gemmer om dig, hvorfor, hvor længe — og hvad du kan bede os om.

sektioner:
  - overskrift: Hvem vi er
    tekst: >-
      Ink and Art Cph ApS, CVR 44226413, Larsbjørnsstræde 13 kld, 1454
      København K, er ansvarlig for de oplysninger du giver os. Har du
      spørgsmål, så ring på 55 24 86 08 eller skriv til
      booking@inkandart.dk.

  - overskrift: Når du booker en tid
    tekst: >-
      Vi behandler navn, e-mail, telefonnummer og det du selv skriver om
      din idé — for at kunne holde din tid, minde dig om den (SMS og
      e-mail) og forberede arbejdet. Grundlaget er aftalen med dig.

  - overskrift: Når du betaler depositum eller køber i shoppen
    tekst: >-
      Shopify behandler dine betalings- og ordreoplysninger. Vi ser aldrig
      dit kortnummer. Grundlaget er aftalen med dig og bogføringsloven.

  - overskrift: Når du skriver dig op til Blackbook
    tekst: >-
      Vi behandler din e-mail for at sende dig besked om nætter, drops og
      events. Grundlaget er dit samtykke — og du kan trække det tilbage
      når som helst via afmeld-linket nederst i hver mail.

  - overskrift: Når du bliver tatoveret eller piercet
    tekst: >-
      Vi noterer det der er nødvendigt for at udføre arbejdet forsvarligt
      — placering, motiv eller smykke, og det du fortæller os om forhold
      vi skal tage hensyn til. Er du under 18 og skal have en piercing,
      gemmer vi din forælders samtykke.

  - overskrift: Når du besøger sitet
    tekst: >-
      Vi måler trafik med Vercel Web Analytics. Det er cookieløst: der
      sættes ingen cookies, der bruges ingen fingerprinting, og din
      IP-adresse gemmes ikke. Vi ser hvilke sider der bliver besøgt —
      aldrig hvem du er.

  - overskrift: Hvem vi deler med
    tekst: >-
      Vi sælger aldrig dine oplysninger. Vi bruger databehandlere til at
      drive forretningen: Book.dk (bookingsystem og SMS-påmindelser),
      Shopify (betaling, ordrer og mailliste), Simply.com (vores mail) og
      Vercel (hosting og cookieløs trafikmåling). De behandler kun efter
      aftale med os.

  - overskrift: Hvor længe vi gemmer
    tekst: >-
      Bogføringsmateriale — ordrer og betalinger — gemmes i 5 år efter
      regnskabsårets udløb, som loven kræver. Bookingoplysninger gemmer vi
      så længe du er kunde hos os. Blackbook-tilmeldinger gemmes til du
      afmelder dig. Billeder af dit færdige arbejde bruger vi kun med dit
      samtykke, og du kan trække det tilbage.

  - overskrift: Dine rettigheder
    tekst: >-
      Du kan bede om indsigt i hvad vi har om dig, få rettet forkerte
      oplysninger, få slettet det vi ikke er forpligtet til at gemme, og
      gøre indsigelse mod behandlingen. Skriv til booking@inkandart.dk —
      vi svarer hurtigst muligt og senest inden for en måned.

  - overskrift: Klage
    tekst: >-
      Er du utilfreds med hvordan vi behandler dine oplysninger, vil vi
      gerne høre det først — men du kan altid klage til Datatilsynet,
      www.datatilsynet.dk.

  - overskrift: Sidst opdateret
    tekst: 30. august 2026.
