# Piercing hos Ink & Art — husets standardtekst (H6, Stevens bestilling
# 30/8: «Vægt på hvor meget vi ved at det betyder for kunden at få det
# lavet. Hvordan det kan være både frisættende og en vigtig markør.»)
# [ORD-TJEK Steven] — rettes via PR indtil HOUSE-CMS-01 er i drift;
# Decap er nedlagt (CMS-RULING-01, 31/8).

titel: Piercing hos Ink & Art
tekst: >-
  En piercing er sjældent bare et smykke. For nogle er den en
  fejring — af en fødselsdag, et farvel, et nyt kapitel. For andre er
  den friheden til selv at bestemme over sin egen krop, og for mange
  er den en markør: her står jeg nu. Det ved vi godt hernede. Derfor
  får du ro, rene hænder og et ærligt ord om hvad der klæder dig — og
  hvad der skal hele først. Vi sælger smykker over disken og skifter
  gerne dem du har.

