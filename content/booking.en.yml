# Booking page, English. Same facts as content/booking.yml, own voice.
# The deposit amount must match the Shopify product — change one, change both.

lede: >-
  Book your time — it costs nothing and commits you to nothing. If you
  are sitting for a full day, a 100 kr deposit confirms the time; it
  comes off the price. Rebook at least 48 hours ahead.
book_trin: >-
  Pick a treatment and an artist, find a time that suits you, and write
  motif, size and placement in the comment. It takes two minutes.
door_label: Book your time
depositum_label: Deposit 100 kr — comes off the price
samtykke_trin: >-
  Fill in the consent form at home. It takes two minutes on your sofa and
  ten at the counter — then we spend your time in the chair on the work
  instead of on paperwork.
samtykke_label: Fill in the consent form
konsultation: >-
  Big pieces start with a free, no-obligation consultation. Call, or come
  by and talk it over at the counter — we draw our way to it together
  before you book.
note: >-
  Questions about the piece or the price? Call — or come by and ask at the
  counter.
depositum_trin: >-
  Booking a full-day session? You confirm it with a deposit afterwards —
  the link is in your confirmation mail. Use the same email address as in
  the booking — that is how we find the two together.
tak_titel: Your time is booked
tak_betalt: >-
  The confirmation comes by mail from the booking system. If you are
  sitting for a full day, the deposit link is in that same mail — pay
  with the same email address, so the two belong together.
tjek_titel: Check your deposit
tjek_hjaelp: >-
  Enter the order number from your receipt and we'll look up the payment.
tjek_knap: Look it up
svar_betalt: The deposit is paid. We can see it on the order.
svar_ikke_betalt: >-
  The order exists, but the payment has not gone through yet. Try again in
  a moment — or give us a call.
svar_ukendt: >-
  We can't find a deposit with that number. Check the receipt, or call us
  and we'll find it together.
svar_ugyldigt: That doesn't look like an order number. It's on your receipt.
svar_kan_ikke_tjekke: >-
  We can't look it up right now. Call us and we'll find your payment.
foto: /slots/H-04.jpg
billedtekst: The reception with the house mark.
