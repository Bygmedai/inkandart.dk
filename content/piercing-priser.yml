# Piercingpriser — ÉT tal, to sprog.
#
# Nizar har godkendt listen (Steven, 31/8 2026). Det er FULD PRIS. Intro-
# tilbuddet til de første 100 er markedsføring og kører på Instagram; det
# hører ikke hjemme i en fil på fladen.
#
# HVORFOR ÉN FIL OG IKKE TO. Haruki bad om en test der fanger drift mellem
# en dansk og en engelsk prisliste — og skrev samtidig at en struktur hvor
# tallet kun findes ét sted ville være bedre end testen. Den findes: hver
# linje bærer sit tal én gang og sit navn på begge sprog. To lister kan
# drive fra hinanden; én liste kan ikke.
#
# Navnene ER oversat med vilje — «Enkelt øreflip» og «Single lobe» er det
# samme sted sagt til to mennesker. Tallet er ikke oversat, fordi 375 kr
# er 375 kr.
#
# Retter nogen en pris, rettes den ét sted og slår igennem begge sprog.
# Opdigt aldrig en pris. Er den ikke godkendt af huset, står den ikke her.

intro:
  da: >-
    Faste priser. Anna sætter alle piercinger undtagen intime — og skifter
    gerne det smykke du allerede har.
  en: >-
    Fixed prices. Anna does every piercing except intimate ones — and is
    happy to change the jewellery you already wear.

