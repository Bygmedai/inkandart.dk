# FAQ — English surface. Same substance, own voice.

titel: FAQ
lede: The questions we hear most — at the counter and in the inbox.

sporgsmal:
  - q: What does a tattoo cost?
    a: >-
      The price is agreed with your artist based on motif, size and
      placement — one motif, one fixed price. No hourly rate, no
      surprises.
  - q: Can I just walk in?
    a: >-
      Yes. Walk in when a chair is free — Thursday, Friday and
      Saturday, 10:00–05:00. Want a guaranteed slot? Book ahead.
  - q: How do I book?
    a: >-
      Pay the deposit (from 100 kr) on the booking page and pick your
      time. The deposit is deducted from the price.
  - q: Can I rebook?
    a: >-
      Yes — rebook no later than 48 hours before your session and the
      deposit follows you. Later cancellations or no-shows forfeit it.
  - q: What about large pieces?
    a: >-
      Large pieces start with a free, no-obligation consultation.
      Call us, or come by and talk it through at the counter.
  - q: How old do I need to be?
    a: >-
      18 for tattoos — that's Danish law, and we ask for photo ID if
      in doubt. Piercing under 18 requires a parent present in the
      shop.
  - q: What does a piercing cost?
    a: >-
      By agreement — call us or come by the shop. We also sell
      jewellery over the counter.
  - q: Are touch-ups included?
    a: >-
      Tattoo touch-ups are free within 3 months, by appointment.
      After that, price is agreed with the artist.
  - q: How do gift cards work?
    a: >-
      Bought online, the code arrives by email right away. Valid for
      3 years, for tattoos, piercing and goods in the shop.
  - q: Where are you?
    a: >-
      Larsbjørnsstræde 13, the basement — in the middle of
      Pisserenden, 1454 Copenhagen K.
