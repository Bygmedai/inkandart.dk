# Butikkens tider — ÉT sted for hele huset.
#
# Kilden er husets egen teamguide (Simone), bekræftet af Steven 31/8 2026.
#
# RETTET 1/9 efter Harukis fund. Filen stod først med EMMAS VAGTER — tir/ons
# 13–23, tor 16–02.30, fre/lør 19–05.30. Det var forkert på to måder:
#
#   1. Mandag og søndag manglede helt. Huset er åbent begge dage.
#   2. 05.30 er Emmas NEDLUKNING efter lukketid, ikke et tidspunkt en kunde
#      kan komme ind på. Det stod på fladen som en åbningstid.
#
# Præmissen «butikken er åben Emmas tider» holdt så længe hun var den eneste
# faste. Huset har nu tre i stolen og en piercer, og sine egne tider. En
# artists kalender og husets åbningstid er ikke det samme, og fladen må kun
# vise det sidste.
#
# HVORFOR ÉT STED: den 31/8 stod den samme åbningstid i seks filer i to
# formater. Den blev rettet to gange på en time, og begge gange slap to
# filer igennem, fordi de skrev tiden anderledes. Det er ikke en fejl nogen
# begik; det er hvad seks kopier gør.
#
# Dagene oversættes af ordbogen (lib/i18n.ts). Klokkeslettene står ens på
# begge sprog — et tal der skal oversættes er et tal der kan drive.
#
# Opdigt aldrig en tid. Er den ikke bekræftet af et menneske, udelades den.
tider:
  - dage: [man, tir, ons]
    fra: "13"
    til: "22"
  - dage: [tor]
    fra: "13"
    til: "02"
  - dage: [fre, loer]
    fra: "13"
    til: "05"
  - dage: [son]
    fra: "13"
    til: "22"
