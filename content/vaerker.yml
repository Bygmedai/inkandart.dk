# OKANS VÆRKER (S580). Alle ni er hans ARBEJDE — han har tatoveret dem.
#
# TRE af dem er også hans EGET DESIGN, og det er ikke det samme. Steven,
# 14/9: «Alle billeder er hans arbejde. Men kun tre er hans eget design.
# Alle skal på site. Men tre er hans personlige flash.» De tre er mærket
# nedenfor. Resten er tatoveret efter kundens eller en andens forlæg, og
# derfor står der INTET om design i deres billedtekster.
#
# Billedteksten er motiv + teknik, aldrig en titel og aldrig et kredit —
# samme regel som resten af filen. At et værk er hans eget design står
# i en kommentar til et menneske, ikke som en påstand paa fladen.
#
# DE TRE ER IKKE LAGT PÅ /flash. At vise et motiv under «flash» siger til
# kunden at det kan købes og sættes, og det er en handel ingen har
# bekræftet. Afventer Okans ja (og en pris).
#
# Id'erne starter ved V-12: V-11 var allerede taget af Annas industrial,
# som peger paa P-02.jpg. Id og filnavn foelges ad her, saa den naeste
# ikke skal gaette.

