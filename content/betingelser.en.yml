# Terms — English surface. Same substance as the Danish canon, own voice.

titel: Terms
lede: >-
  Standard terms for tattoos, piercing, booking, gift cards and
  purchases at Ink and Art Cph ApS.

sektioner:
  - overskrift: Who we are
    tekst: >-
      Ink and Art Cph ApS · CVR 44226413 · Larsbjørnsstræde 13, the
      basement, 1454 Copenhagen K · booking@inkandart.dk · +45 55 24 86 08.

  - overskrift: Booking and deposit
    tekst: >-
      Book a session through our booking page. The deposit (from 100 kr)
      is paid when you book and is deducted from the price of your tattoo
      or piercing. Deposits are non-refundable but movable: rebook no
      later than 48 hours before your session and the deposit follows you
      to the new time. If you don't show up, or cancel later than that,
      the deposit is forfeited — the chair was held for you. Arrive more
      than 15 minutes late and the slot may have been given away, with
      the deposit treated as forfeited.

  - overskrift: Prices
    tekst: >-
      The price of a tattoo is agreed with your artist based on motif,
      size and placement — one motif, one fixed price. Walk-in offers are
      posted in the shop.

  - overskrift: Age limits
    tekst: >-
      Tattoos require you to be 18 — that's Danish law, and we ask for
      photo ID if in doubt. Piercing under 18 requires a parent's consent,
      with the parent present in the shop.

  - overskrift: What you're agreeing to
    tekst: >-
      A tattoo is permanent. Removal is expensive, it hurts, and it almost
      always leaves a trace — assume that what you get today stays. During
      the work and for the first few days after, the skin can be sore, red
      and swollen; that is normal. An allergic reaction to ink is rare, but
      it happens. Infection is the one risk you hold yourself — it almost
      always comes from aftercare that was not followed.
  - overskrift: Consent form
    tekst: >-
      Before your appointment we ask you to fill in a short form: who you
      are, what you are having done, and the health details that matter —
      pregnancy, blood thinners, allergies, skin conditions. You can do it at
      home at inkandart.dk/samtykke, so we do not spend your chair time on
      paperwork. If you have not, we will do it in the shop. We keep the form
      for as long as you are a customer with us.
  - overskrift: Before we start
    tekst: >-
      Show up sober and rested. Tell us about allergies, medication,
      pregnancy or health conditions that could matter — it stays between
      us. You follow the aftercare you are given; that is what decides how
      it heals. We may decline to work if we judge it isn't safe; if so,
      your session and deposit are moved.

  - overskrift: Touch-ups
    tekst: >-
      Tattoo touch-ups are free within 3 months of your session, by
      appointment — book it as «Touch-up» or write to us. After that,
      price is agreed with the artist.

  - overskrift: Right of withdrawal
    tekst: >-
      A booked session and work begun or completed is a delivered
      service — the statutory right of withdrawal lapses once the work is
      carried out with your consent. Deposits follow the rules above.
      Goods bought in the webshop (prints, jewellery) can be returned
      within 14 days of receipt; used piercing jewellery is not taken
      back for hygiene reasons.

  - overskrift: Gift cards
    tekst: >-
      Gift cards bought online are delivered as a code by email and can
      be used for tattoos, piercing and goods in the shop. Gift cards are
      valid for 3 years from purchase and cannot be exchanged for cash.

  - overskrift: Payment
    tekst: >-
      Pay in the shop (card, MobilePay, cash) or online via Shopify
      checkout. Online purchases are confirmed by email.

  - overskrift: Aftercare and complaints
    tekst: >-
      You get aftercare instructions from the chair — they're also at
      inkandart.dk/aftercare. If something is wrong with a product or a
      service, contact us at booking@inkandart.dk — Danish consumer law
      applies.

  - overskrift: Who is responsible for what
    tekst: >-
      We answer for the work and for hygiene: clean hands, new needles,
      sterile equipment, and a result we stand behind. If something is wrong
      with what we made, tell us — we will put it right. What happens to your
      skin after you leave depends on aftercare, and that part is yours. If
      it is not followed, we cannot answer for how it heals.
  - overskrift: Photos
    tekst: >-
      We only photograph your finished work for the wall or our channels
      if you say yes. You tick it on the consent form, it is a separate
      yes, and you can withdraw it again by writing to
      booking@inkandart.dk. A no costs nothing.
