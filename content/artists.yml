# Artist-modellen. I huset = hvem der sidder i stolen.
# Sonja og Simone er huset, ikke stolen — stol: false.
# Håndværkslinjer ud over faget er [AFVENTER] — ikke mockuppens slogans.

- id: nizar
  fornavn: Nizar Saad
  haandvaerk: Tatovør & tegner · grundlægger
  # [ORD-TJEK Steven 31/8] — UDKAST. Fagets navn paa engelsk.
  #
  # Feltet stod TOMT for alle tre artister, saa den engelske flade faldt
  # tilbage til dansk: «Tatovør & tegner · grundlægger» stod paa /en.
  # Stevens fund. Husets regel siger at fagets navn maa oversaettes — men
  # kun af et menneske, aldrig af en agent paa egen haand. Derfor et udkast.
  #
  # «tegner» kan baade vaere illustrator og draughtsman. Jeg har valgt
  # illustrator, fordi det er det en kunde forstaar. Sig til hvis han hellere
  # vil kaldes noget andet — det er hans fag, ikke vores etiket.
  haandvaerk_en: Tattoo artist & illustrator · founder
  # Nizars bio — hans EGNE ORD (Steven, 5/10 2026: «Det er hans egne ord»).
  # Afloeser teksten fra kendelsen 31/8, som var skrevet OM ham i tredje
  # person. Denne er skrevet af ham selv, i foerste person.
  #
  # Ordret som Steven indsatte den, med to rettelser af tegnsaetning og
  # intet andet:
  #   «anderledes  .»       → «anderledes.»   (to mellemrum foran punktum)
  #   «finde ro Tatovering» → «finde ro. Tatovering»   (manglende punktum)
  # Ingen ord er aendret, tilfoejet eller fjernet. Skal tegnsaetningen staa
  # som han skrev den, er det de to steder.
  #
  # Aendrer nogen ORDENE herefter, er det ikke laengere hans tekst.
  #
  # TO AFSNIT, og de skal blive ved med at vaere to. components/rummet/Bio.tsx
  # deler paa tomme linjer; blokken er `|-` (literal), IKKE `>-` (folded),
  # som ville folde afsnittene sammen til én klump.
  #
  # ÉT AFSNIT PR. LINJE. `|-` bevarer HVERT linjeskift — ogsaa en ombrydning
  # der kun var pen i editoren. Linjerne er lange her med vilje.
  #
  # Samme tekst staar i appen (app/data/artists.ts i inkandart-webshop) og i
  # Shopify (metaobject artist/nizar, feltet bio), som appen henter live.
  bio: |-
    Allerede som barn kunne jeg forsvinde ind i timevis med en blyant og papir. Jeg tegnede landskaber, ansigter, træer og dyr. For mig har det altid handlet om at udtrykke sig anderledes. Senere begyndte jeg at male, og maleriet gav mig et sted at fordybe og finde ro. Tatovering kom til som endnu en måde at arbejde kreativt på.

    I dag er kunst stadig min drivkraft. Men mit fokus er også at åbne et rum, hvor andre kan udfolde deres talent. Der skal være plads til både erfarne kunstnere og nye talenter, der står på tærsklen til deres egen rejse. For mig handler det om at skabe et miljø med respekt, tryghed og plads til forskellighed. Et sted, hvor kunsten kan udvikle sig, og hvor nye stemmer kan få lov til at vokse.
  instagram: ink.and.art.cph
  # [ORD-TJEK Nizar] — UDKAST. MIN oversaettelse af hans danske tekst, ikke
  # hans ord. Huset oversaetter ikke en bio for et menneske paa egen haand;
  # den skal godkendes af ham (samme vej som Okans, 15/9). Den tidligere
  # bio_en oversatte den gamle tekst og er dermed foraeldet — at lade den
  # staa ville vise en anden bio paa /en end paa dansk.
  #
  # Naer ordret, i foerste person. Tre valg der er mine:
  #   «udtrykke sig anderledes» → «expressing myself differently»
  #   «fordybe og finde ro»     → «immerse myself and find calm»
  #   «tryghed»                 → «safety» (dansk «tryghed» har intet
  #     enkelt engelsk ord; «a sense of safety» blev for tungt)
  bio_en: |-
    Even as a child I could disappear for hours with a pencil and paper. I drew landscapes, faces, trees and animals. For me it has always been about expressing myself differently. Later I started painting, and painting gave me a place to immerse myself and find calm. Tattooing came along as yet another way to work creatively.

    Today art is still my driving force. But my focus is also on opening a space where others can unfold their talent. There has to be room for both experienced artists and new talents standing on the threshold of their own journey. For me it is about creating an environment of respect, safety and room for difference. A place where art can develop, and where new voices are allowed to grow.
  periode: fast
  foto: /slots/S-04.jpg
  # Billedkarussellen fra profilen også på forsidens kort (Steven 6/10:
  # «Gider du flette samme feature ind på forsiden under Nizar som under
  # hans profil» · «Kun Nizar»). Slå til på en anden artist på samme måde.
  forside_galleri: true
  billedtekst: Nizar Saad foran husets skilt.
  # Fire billeder af Nizar selv (Steven, 15/9 2026). Med portrættet er
  # det fem — præcis loftet (GALLERI_MAX). Der er ikke plads til flere.
  #
  # S-12 OG S-13 ER HAM, OGSÅ SELV OM HAN IKKE LIGNER SIG SELV.
  # Jeg meldte dem først som en anden mand: han har hår på dem, og han er
  # skaldet i dag. Steven, som kender ham: «Nej det er ham, bare for 5 år
  # siden. Det kan jeg bekræfte.» Pandelampen lyser direkte ind i kameraet
  # på begge, så hudtone og øjenfarve er ikke til at læse ud af dem.
  #
  # Lært: et menneskes identitet afgøres ikke af to fotos og min
  # sammenligning. Spørg den der kender personen — og hvis der er tvivl,
  # så lad være med at lægge billedet op imens.
  fotos:
    - fil: /slots/S-12.jpg
      tekst: Nizar tatoverer med pandelampe på og kigger op mod kameraet.
      fokus: ""
    - fil: /slots/S-13.jpg
      tekst: Nizar bøjet over en underarm under arbejde, set i profil.
      fokus: ""
    - fil: /slots/S-11.jpg
      tekst: Nizar på sin motorcykel foran et værtshus i København.
      fokus: ""
    - fil: /slots/S-10.jpg
      tekst: Nizar i solbriller under palmer, tatoverede hænder.
      fokus: ""
  aktiv: true
  stol: true

- id: emma
  # Emmas eget ønske, 30/9 (via Steven): kun «Emma Wind».
  fornavn: Emma Wind
  # Udvidet 1/9 (Harukis fund): linjen udelod den fine streg hun faktisk
  # laver. V-06 er «Sol, fin streg og prikker, håndled», og to af de tre
  # nye billeder fra 31/8 er fin streg. Kortet solgte hende for smalt.
  haandvaerk: Tatovør · farvet flash, traditionelt og fin streg
  # [ORD-TJEK Steven 31/8] — UDKAST, samme grund som Nizars.
  # «farvet flash» → «colour flash»; britisk stavemaade, som resten af
  # den engelske flade.
  haandvaerk_en: Tattoo artist · colour flash, traditional and fine line
  # Emmas egne tider, sendt til Steven 31/8 2026 og videregivet ordret:
  #   «Jeg er i butikken 13-23 tirsdag og onsdag
  #    16-2.30 torsdag
  #    19-5.30 fredag og lørdag»
  #
  # Tallene er hendes. De er IKKE udledt af husets aabningstid, og de maa
  # ikke rettes til for at passe med den.
  #
  # AFGJORT af Steven, S578: «Husets er de rette. Hendes var hendes
  # arbejdstider.» Konflikten var altsaa ikke en konflikt — de to taeller
  # to forskellige ting:
  #
  #   husets tider   = hvornaar doeren er aaben (content/aabningstider.yml)
  #   en artists     = hvornaar hun er paa arbejde, inkl. nedlukning efter
  #                    lukketid
  #
  # Derfor SKAL Emma kunne slutte efter huset (ons 23 mod 22, tor 02.30 mod
  # 02, loer 05.30 mod 05). Det er ikke en fejl, og det maa ikke «rettes».
  # Labellen siger «I huset» / «In the house» — hun er der, doeren er ikke
  # noedvendigvis aaben. Se Tider.tsx, som siger det samme.
  tider:
    - dage: [tir, ons]
      fra: "13"
      til: "23"
    - dage: [tor]
      fra: "16"
      til: "02.30"
    - dage: [fre, loer]
      fra: "19"
      til: "05.30"
  # Handle fra Steven 31/8: https://www.instagram.com/winds_tattoos
  instagram: winds_tattoos
  periode: fast
  foto: /slots/S-02.jpg
  billedtekst: Emma Wind i huset.
  # Emmas egne ord, fra hendes præsentation (Artister/Emma, 30/8).
  bio: >-
    Jeg elsker det kreative håndværk, detaljerne og mødet med alle de
    forskellige mennesker, der kommer forbi. Uanset om du kommer med en
    klar idé eller kun en tanke, hjælper jeg dig gerne med at gøre den
    til virkelighed. Jeg går op i at skabe et flot og gennemført
    resultat, samtidig med at du føler dig tryg og godt tilpas gennem
    hele processen.
  # Emmas engelske bio (Haruki, 1/9). Oversat fra HENDES egne ord ovenfor
  # og ord-tjekket. Feltet stod tomt, saa den engelske profil faldt tilbage
  # til dansk.
  bio_en: >-
    I love the craft, the detail, and meeting all the different people who
    come through. Whether you arrive with a clear idea or only a thought,
    I'll gladly help you make it real. It matters to me that the result is
    finished and worth looking at — and that you feel safe and comfortable
    the whole way through.
  aktiv: true
  stol: true

# Anna Ogłuszka (piercer 31/8–28/9) er ikke længere i huset. Steven, 28/9:
# «Anna skal fjernes.» Piercing bliver — uden navn (samme dag).
# /stolen/anna sender videre til /stolen (lib/redirects.ts).

- id: okan
  # Okan — IKKE «Orkan». Steven skrev Orkan i tråden, Okans egen besked
  # skriver Okan tre gange om sig selv. Bekræftet af Steven 14/9 2026:
  # «Okan er navnet.» Efternavn er ikke oplyst endnu; Nizar, Emma og Anna
  # står med fulde navne, så spørg ham om han vil have sit med.
  fornavn: Okan
  # Samme form som Emmas linje: faget, så det han faktisk laver.
  haandvaerk: Tatovør · realisme og fin streg
  haandvaerk_en: Tattoo artist · realism and fine line
  #
  # DEN DANSKE BIO ER GODKENDT AF OKAN (Steven, 15/9 2026: «Okan har
  # sagt ja til hans danske bio»). Teksten er hans nu.
  #
  # Hvordan den blev til, fordi det er den slags der ellers glemmes:
  # Okan skrev sin tekst på ENGELSK (WhatsApp til Steven, 13/9). bio_en
  # herunder er hans ord ORDRET. Den danske er MIN oversættelse — og
  # huset oversætter normalt ikke en bio for et menneske (S574, og
  # hint'et i docs/cms/indholds-kontrakt.yml siger det samme). Steven
  # bad om et udkast og tog det til ham.
  #
  # Han kan ikke dansk, så et «ja» til en tekst han ikke kan læse er
  # ingenting værd. Derfor fik han ogsaa en TILBAGE-oversættelse af min
  # danske tekst til engelsk, så han kunne se om dansken sagde det han
  # mente. Det er DEN han sagde ja til.
  #
  # Tre valg var mine, ikke hans, og de indgik i det han godkendte:
  #   «fine line»  -> «fin streg»  (husets ord i forvejen, jf. Emma)
  #   «designs»    -> «motiver»    (dansk tatoveringssprog, Groks brief)
  #   Hans engelske tekst siger TO gange at realisme og fin streg er
  #   kernen (afsnit 1 og 3). Begge står; intet er fjernet bag hans ryg.
  #
  # Ændrer nogen den danske tekst herefter, er det ikke længere den han
  # har set. Så skal han spørges igen — med en ny tilbage-oversættelse.
  bio: |-
    Okan — professionelt kendt som artfulltattoo — er en cypriotisk tatovør i København med fem års erfaring i faget. Hans hovedfelt er realisme, som han kombinerer med en stærk sans for det kreative og en forkærlighed for unikke motiver, tegnet til den enkelte. Han arbejder også meget med fin streg: rene, sarte og omhyggeligt detaljerede stykker.

    For Okan er de bedste tatoveringer personlige. I stedet for at gentage en idé, der allerede findes, arbejder han tæt sammen med kunden for at forstå historien, mennesket og tanken bag — og laver den så om til et originalt motiv, tegnet til netop dem. Det kreative, og evnen til at gøre en idé til en tatovering der står stærkt, er kernen i hans arbejde.

    Realisme og fin streg er hans fundament, men han er hjemmevant i andre teknikker og stilarter, når motivet eller mennesket kalder på det. Hver opgave bliver grebet an for sig, med blik for detaljen, kompositionen og for den, der skal bære den.

    Han kommer fra Cypern, bor i København og arbejder fortsat internationalt gennem gæsteophold og samarbejder. Målet er at blive ved med at udvikle sit eget udtryk, flytte sine grænser og lave tatoveringer, der er teknisk gennemførte, stærke at se på og helt igennem personlige for den enkelte.
  # Okans egne ord, ordret fra hans besked. Røres ikke.
  bio_en: |-
    Okan, professionally known as artfulltattoo, is a Cypriot tattoo artist based in Copenhagen, Denmark, with five years of experience in the tattoo industry. His main artistic focus is realism, which he combines with a strong sense of creativity and a passion for creating unique, custom-made tattoo designs. He also works extensively with fine line, creating clean, delicate and carefully detailed pieces.

    Okan believes that the best tattoos are personal. Rather than simply reproducing existing ideas, he enjoys working closely with his clients to understand their stories, personalities and concepts, then turning them into original designs created specifically for them. Creativity and the ability to transform an idea into a visually strong tattoo are central to his artistic approach.

    While realism and fine line are at the core of his work, Okan is comfortable exploring different techniques and styles depending on the concept and the client. Every project is approached individually, with attention to detail, composition and the character of the person wearing the tattoo.

    Originally from Cyprus and now based in Copenhagen, Okan also continues to work internationally through guest spots and collaborations. His goal is to continue developing his artistic identity, push his creative boundaries and create tattoos that are technically refined, visually striking and truly personal to each client.
  # BEKRÆFTET 15/9 2026. Okan sendte sit WhatsApp Business-kort videre
  # gennem Steven; Instagram står som «artfulltattoo» på hans egen
  # virksomhedskonto. Stod før som et gæt udledt af hans professionelle
  # navn — og et gæt er en død handling hvis det er forkert.
  #
  # Jeg kunne ikke selv måle det: Instagram svarer 302 på ethvert handle
  # uden login, også et jeg fandt på. Målingen kunne altså ikke skelne,
  # og et menneske måtte bekræfte det. Skrevet ned, så den næste ikke
  # prøver den vej igen.
  #
  # Kortet viser ogsaa et andet handle, retro_ink_art_studio, og en
  # privat mailadresse. Handle nr. 2 er ikke hans egen profil og staar
  # derfor ikke her; mailen hoerer ingen steder hjemme i et offentligt
  # repo og er bevidst udeladt.
  instagram: artfulltattoo
  # TikTok, bekræftet af Steven 15/9 med link. Handle'et er IKKE det samme
  # som paa Instagram — dér hedder han artfulltattoo, her okan.artfulltattoo.
  # Derfor to felter og ikke ét.
  tiktok: okan.artfulltattoo
  periode: fast
  foto: /slots/S-09.jpg
  # Portrættet beskriver MENNESKET, ikke et motiv — det er hans ansigt,
  # ikke hans arbejde. Resten af billederne er værker og står i vaerker.yml.
  billedtekst: Okan, tatovør i huset.
  # Fire værker ud over portrættet — loftet er fem i alt (GALLERI_MAX).
  # Valgt så galleriet viser DE TO FELTER hans bio nævner: to i realisme
  # (V-11, V-12, begge hans eget design) og to i fin streg (V-15 koi,
  # V-14 liljer). Viser man kun realisme, sælger kortet ham for smalt —
  # samme fejl som Emmas linje havde før Harukis fund 1/9.
  fotos:
    - fil: /slots/V-12.jpg
      tekst: Lotusblomst over et kvindeansigt med revnet overflade, sort og gråt, skulder.
      fokus: ""
    - fil: /slots/V-13.jpg
      tekst: Gudeskikkelse med brølende løve og græsk mæanderbort, sort og gråt, overarm.
      fokus: ""
    - fil: /slots/V-16.jpg
      tekst: Koifisk og lotus i fin streg med røde streger, underarm.
      fokus: ""
    - fil: /slots/V-15.jpg
      tekst: Liljer i sort og gråt med bløde overgange, overarm.
      fokus: ""
  aktiv: true
  stol: true
  # Book.dk-kalenderen er ikke sat op for ham. Samme kald som Annas:
  # vi tilbyder ikke en tid huset ikke kan give. Tænd når den er sat op.
  booking: false

