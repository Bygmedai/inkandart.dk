# Artist-modellen. I huset = hvem der sidder i stolen.
# Sonja og Simone er huset, ikke stolen — stol: false.
# Håndværkslinjer ud over faget er [AFVENTER] — ikke mockuppens slogans.

- id: nizar
  fornavn: Nizar Saad
  haandvaerk: Tatovør & tegner · grundlægger
  # [ORD-TJEK Steven 31/8] — UDKAST. Fagets navn paa engelsk.
  #
  # Feltet stod TOMT for alle tre artister, saa den engelske flade faldt
  # tilbage til dansk: «Tatovør & tegner · grundlægger» stod paa /en.
  # Stevens fund. Husets regel siger at fagets navn maa oversaettes — men
  # kun af et menneske, aldrig af en agent paa egen haand. Derfor et udkast.
  #
  # «tegner» kan baade vaere illustrator og draughtsman. Jeg har valgt
  # illustrator, fordi det er det en kunde forstaar. Sig til hvis han hellere
  # vil kaldes noget andet — det er hans fag, ikke vores etiket.
  haandvaerk_en: Tattoo artist & illustrator · founder
  # Nizars bio — Stevens kendelse 31/8 2026.
  #
  # Der laa TO tekster i huset: den korte (appen + sitet, identiske, 355
  # tegn) og denne (Shopify-metaobject `artist/nizar`, 542 tegn, sidst roert
  # 6. juli). Steven har afgjort at DENNE er den rette, og at den skal ligge
  # alle tre steder: her, i appen og i Shopify.
  #
  # Shopify er kilden og staar allerede rigtigt. Teksten her er kopieret
  # ORDRET derfra — ikke omskrevet, ikke forkortet, ikke slaaet sammen til
  # ét afsnit. Det ene tegn der afviger fra Stevens indsatte tekst er et
  # dobbelt punktum til sidst, som er en paste-artefakt; Shopify har ét.
  #
  # TRE AFSNIT, og de skal blive ved med at vaere tre. Bio'en laa foer i ét
  # <p>, hvor et linjeskift kollapser i HTML — teksten ville loebe sammen
  # til én klump uden at nogen test gik roed. components/rummet/Bio.tsx
  # deler paa tomme linjer; blokken herunder er `|-` (literal), IKKE `>-`
  # (folded), som ville folde afsnittene sammen igen.
  #
  # ÉT AFSNIT PR. LINJE. `|-` bevarer HVERT linjeskift — ogsaa en ombrydning
  # der kun var pen at se paa i editoren. Foerste forsoeg var ombrudt pent,
  # og teksten fik haarde linjeskift midt i saetningerne. Linjerne er lange
  # her med vilje; det er den eneste maade at faa teksten ordret igennem.
  bio: |-
    Nogle mennesker finder deres vej. Nizar skabte sin. Han besluttede aldrig at blive kunstner, men en dag fandt en blyant vej til hans hånd, og han lod passionen vise retningen.

    Hans stil kan ikke sættes i én genre — den formes af mennesket foran ham, af kemien, af fortællingen, for ingen historier er ens. For ham er en tatovering ikke et motiv men et kapitel, et minde der bliver en del af den man er.

    Med Ink & Art Copenhagen bygger han ikke blot et studio, men et sted hvor mennesker foreviger deres livshistorie — én tatovering ad gangen.
  instagram: ink.and.art.cph
  # [ORD-TJEK Steven 31/8] — UDKAST, skrevet om efter kendelsen. Den
  # tidligere bio_en oversatte den KORTE tekst og er dermed foraeldet.
  #
  # Egen stemme, ikke ord-for-ord. Samme tre afsnit, samme substans, ingen
  # tilfoejelser. To valg jeg vil have din dom over:
  #   «besluttede aldrig at blive kunstner» → «never set out to be an
  #     artist». Ordret ville vaere «never decided to become», som lyder
  #     forkert paa engelsk.
  #   «foreviger deres livshistorie» → «set their life story down for
  #     good». «Immortalise» blev for hoejtideligt til husets stemme.
  bio_en: |-
    Some people find their way. Nizar made his. He never set out to be an artist, but one day a pencil found its way into his hand, and he let the passion point the way.

    His style will not sit in one genre — it takes shape from the person in front of him, from the chemistry, from the story, because no two stories are alike. To him a tattoo is not a motif but a chapter, a memory that becomes part of who you are.

    With Ink & Art Copenhagen he is not just building a studio, but a place where people set their life story down for good — one tattoo at a time.
  periode: fast
  foto: /slots/S-04.jpg
  billedtekst: Nizar Saad foran husets skilt.
  aktiv: true
  stol: true

- id: emma
  fornavn: Emma Windinnalls
  haandvaerk: Tatovør · farvet flash og traditionelt
  # [ORD-TJEK Steven 31/8] — UDKAST, samme grund som Nizars.
  # «farvet flash» → «colour flash»; britisk stavemaade, som resten af
  # den engelske flade.
  haandvaerk_en: Tattoo artist · colour flash and traditional
  # Emmas egne tider, sendt til Steven 31/8 2026 og videregivet ordret:
  #   «Jeg er i butikken 13-23 tirsdag og onsdag
  #    16-2.30 torsdag
  #    19-5.30 fredag og lørdag»
  #
  # Tallene er hendes. De er IKKE udledt af husets aabningstid, og de maa
  # ikke rettes til for at passe med den.
  #
  # ⚠ KONFLIKT, ikke loest her: huset siger fire steder «Torsdag, fredag og
  # loerdag kl. 10–05» (gaden.yml, gaden.en.yml, huset.yml, faq.yml). Emma
  # er der ogsaa tirsdag og onsdag, og til 05.30 fredag/loerdag. Enten er
  # husets linje foraeldet, eller ogsaa er hun der uden at doeren er aaben.
  # Det er Stevens kald — se PR-teksten.
  tider:
    - dage: [tir, ons]
      fra: "13"
      til: "23"
    - dage: [tor]
      fra: "16"
      til: "02.30"
    - dage: [fre, loer]
      fra: "19"
      til: "05.30"
  # Handle fra Steven 31/8: https://www.instagram.com/winds_tattoos
  instagram: winds_tattoos
  periode: fast
  foto: /slots/S-02.jpg
  billedtekst: Emma Windinnalls i huset.
  # Emmas egne ord, fra hendes præsentation (Artister/Emma, 30/8).
  bio: >-
    Jeg elsker det kreative håndværk, detaljerne og mødet med alle de
    forskellige mennesker, der kommer forbi. Uanset om du kommer med en
    klar idé eller kun en tanke, hjælper jeg dig gerne med at gøre den
    til virkelighed. Jeg går op i at skabe et flot og gennemført
    resultat, samtidig med at du føler dig tryg og godt tilpas gennem
    hele processen.
  aktiv: true
  stol: true

