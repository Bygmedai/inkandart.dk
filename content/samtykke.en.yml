# The consent form — English. Same substance, own voice.
#
# Formen er Simones (Fra Simone, 31/8). Rettes frit; felterne selv bor i
# lib/samtykke.ts, fordi de skal proeves.

titel: Consent
lede: >-
  Fill this in before you come. Then we spend your chair time on the work
  instead of on paperwork. Two minutes at home is ten minutes down here.
dig: You
dit_navn: Full name
foedselsdato: Date of birth
email: Email
telefon: Phone
arbejdet: The work
kunstner: Artist
aftale_dato: When is your appointment
aftale_hint: >-
  The date is in your booking confirmation. We use it to file the form
  under the right day.
placering: Where on the body
motiv: What are we making
motiv_hint: Describe it in your own words. What you have in mind, what it should say.
stoerrelse: How big
stoerrelse_valg:
  - { id: lille, tekst: Smaller than a palm }
  - { id: mellem, tekst: Between a palm and a forearm }
  - { id: stor, tekst: Larger than a forearm }
farve: Colour or black
farve_valg:
  - { id: sort, tekst: Black ink }
  - { id: farve, tekst: Colour }
helbred: Health
helbred_lede: >-
  Tick anything that applies to you. It stays between us and your artist,
  and it only changes how we go about it.
helbred_valg:
  - { id: gravid, tekst: I am pregnant or breastfeeding }
  - { id: blodfortyndende, tekst: I take blood-thinning medication }
  - { id: allergi, tekst: I am allergic to ink or latex }
  - { id: hudlidelse, tekst: I have a skin condition or sensitive skin }
  - { id: andet, tekst: Something else that might matter }
helbred_note: Anything you want to add?
erklaering: Declaration
erklaering_valg:
  - { id: atten, tekst: I am 18 or over. }
  - { id: permanent, tekst: I understand a tattoo is permanent, and that removal is expensive and leaves a trace. }
  - { id: aftercare, tekst: I will follow the aftercare I am given. It decides how this heals. }
foto_ok: >-
  You may use a photo of the finished work on the wall and on your channels.
  A no costs nothing.
send: Send
sender: Sending
tak_titel: Thank you
tak: >-
  We have it, and a copy is on its way to your inbox. Keep it — then you
  have your own words. Nothing more to do; just come to your appointment.
fejl: >-
  It was NOT sent. We would rather say so than pretend — so you know you
  need to do something. Try again, or fill it in down here when you arrive.
fejl_halvt: >-
  We have most likely received your form — but your copy did not go
  through. Do NOT send it again; then we would get it twice. Write to us,
  or mention it at the counter when you arrive.
fejl_felter: Something is missing above. Check the marked fields.
print: Print it instead
betingelser_linje: See the house terms as well.
