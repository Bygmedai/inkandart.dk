# Bookingsiden. Sonja retter her — ikke i koden.
# depositum_label: knappens tekst. Beløbet skal matche Shopify-produktet.

# S574 (Steven, 30/8): booking er GRATIS og ét flow. Depositummet er
# flyttet BAG bookingen, fordi det før spærrede alle kunder for at
# beskytte mod udeblivelser på de få lange sessioner. Rækkefølgen her
# er derfor: book din tid → betal depositum hvis sessionen er lang.
lede: >-
  Book din tid — det koster ikke noget, og du binder dig ikke.
  Skal du sidde en hel dag, bekræfter et depositum på 100 kr tiden;
  det fragår i prisen. Ombook senest 48 timer før.
door_label: Book din tid
depositum_label: Depositum 100 kr — fragår i prisen
# Trin 2: samtykket. Formularen fandtes fra 1/9, men INGEN vej førte til
# den — målt 2/9: ordet «samtykke» stod 0 gange på /booking, /, /en/booking
# og /en. Vi byggede noget ingen kunde kunne finde.
samtykke_trin: >-
  Udfyld samtykket hjemmefra. Det tager to minutter på sofaen og ti ved
  disken, og så bruger vi din tid i stolen på arbejdet i stedet for papir.
samtykke_label: Udfyld samtykket
# [ORD-TJEK Steven] H3 30/8: konsultationen er en kapacitet huset har.
konsultation: >-
  Store motiver starter med en gratis og uforpligtende konsultation.
  Ring, eller kom forbi og tag snakken ved disken — så tegner vi os
  frem til det sammen, før du booker.
note: >-
  Spørgsmål om motiv eller pris? Ring på — eller kom forbi og tag
  snakken ved disken.
# Trin 2 er kun for de lange sessioner. Kunden skal IKKE skrive et
# ordrenummer nogen steder: mailadressen står allerede i både Book.dk
# og Shopify, og det er den vi afstemmer på.
depositum_trin: >-
  Booker du en heldags-session, bekræfter du tiden med et depositum
  bagefter — linket ligger i din bekræftelsesmail. Brug samme
  mailadresse som i bookingen, så finder vi de to ting sammen.

# Tak-siden. tak_betalt må ALDRIG påstå at systemet har set en betaling
# uden faktisk at have spurgt Shopify.
tak_titel: Din tid er booket
tak_betalt: >-
  Bekræftelsen kommer på mail fra bookingsystemet. Skal du sidde en hel
  dag, ligger depositum-linket i samme mail — betal med samme
  mailadresse, så hører de to ting sammen.
tjek_titel: Tjek dit depositum
tjek_hjaelp: >-
  Skriv ordrenummeret fra din kvittering, så slår vi betalingen op.
tjek_knap: Slå op
svar_betalt: Depositummet er betalt. Vi kan se det på ordren.
svar_ikke_betalt: >-
  Ordren findes, men betalingen er ikke gået igennem endnu. Prøv igen om
  lidt — eller ring til os.
svar_ukendt: >-
  Vi kan ikke finde et depositum med det nummer. Tjek kvitteringen, eller
  ring til os, så finder vi det sammen.
svar_ugyldigt: Det ligner ikke et ordrenummer. Det står på din kvittering.
svar_kan_ikke_tjekke: >-
  Vi kan ikke slå op lige nu. Ring til os, så finder vi din betaling.
foto: /slots/H-04.jpg
billedtekst: Receptionen med husets mærke.
