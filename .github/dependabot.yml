# Dependabot config — S459 founder override · S471 grouping · S549 drain+faucet-fix
# (Steven GO 2026-08-06; jf. Sirius APPROVE_WITH_GUARDS 2026-06-15 + RULING S502 v2a).
#
# S549, maalt: 44 aabne dependabot-PRs org-bredt. Tre rettelser i denne fil:
#  1. SECURITY-GROUPING (applies-to: security-updates): open-pull-requests-limit
#     gaelder KUN version-updates (GitHub docs), saa security-PRs ankom enkeltvis
#     udenom alle limits (maalt: bygmedai-portal 10 aabne ved limit 0).
#     Nu samles de i een PR pr. oekosystem.
#  2. Dev-gruppen tog majors med -> "mixed group" -> ineligible for v2a-auto-merge
#     -> gruppen kunne aldrig draene (maalt: Ads-orchestrator #286). Nu kun
#     minor+patch; majors kommer enkeltvis og ruter til migration-slice (policy §5).
#  3. COOLDOWN: patch/minor venter 7 dage, majors 30 -> faerre, mere batchede PRs.
#     Cooldown gaelder ALDRIG security-updates og understoettes ikke for
#     github-actions (GitHub docs, verificeret S549).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Copenhagen"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      # S496-opfoelgning (Steven GO 19/9-2026): sikkerhedsgruppen er delt i prod og dev.
      # Maalt i bygmedai-portal#97: den udelte gruppe lagde en udeklareret dev-major
      # (vitest ^4 -> ^5) i SAMME PR som en kritisk next-RCE-patch. npm ci doede paa
      # ERESOLVE, hele quality-gate faldt, og main stod paa den saarbare next i en uge.
      # Det er praecis fejlklassen S546 allerede loeste for version-updates ("en gruppe
      # der ikke kan merges, leverer nul opdateringer") — nu ogsaa for security-updates.
      # Vi bruger IKKE ignore paa majors: ignore gaelder ogsaa security-updates og ville
      # skjule CVEs hvis kun en major lukker dem (GHSA-82fw-gwwq-j7x9 er netop saadan en).
      npm-security-prod:
        applies-to: security-updates
        dependency-type: "production"
        patterns: ["*"]
      npm-security-dev:
        applies-to: security-updates
        dependency-type: "development"
        patterns: ["*"]
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: "development"
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "[G33:A] chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "[G33:A] chore(actions)"
    labels:
      - "github-actions"
      - "automated"