# Porten — INLINE på dette repo. Ikke et kald til Bygmedai/.github.
#
# HVORFOR INLINE: inkandart.dk er husets eneste PUBLIC repo, og Bygmedai/.github
# er privat. GitHub forbyder et public repo at kalde en reusable workflow i et
# privat repo — kaldet dør ved opstart med nul jobs og uden log, så det ligner
# en syntaksfejl. Bevis: dette repos dependabot-auto-merge.yml har kørt 100
# gange og fejlet 100 gange, aldrig én grøn, siden den blev lagt ind.
#
# S565 flyttede porten.mjs ind i hvert repo (.porten/) netop af den grund. Men
# selve kaldet skal også være inline her. Logikken er den samme fil som alle
# andre repoer kører — .porten/porten.mjs, 48/48 selvtests — så den kan stadig
# opdateres ét sted og udrulles af installeren.
#
# Den rigtige rettelse er at gøre repoet privat, så det kan arve som de andre.
# Det er en beslutning om Actions-minutter, ikke om kode.
name: Porten
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # S579 (2/9): en laast sti frigives af et menneskes godkendelse — saa porten
  # skal vaagne naar den gives, og naar den trakkes tilbage. Foer dette koerte
  # porten aldrig paa en review: Steven godkendte #289 tolv sekunder efter
  # portens sidste koersel, og den stod roed for evigt.
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read
  # S579: review-koerslen genstarter push-koerslen (se nedenfor). Kun egne runs.
  actions: write

concurrency:
  # Egen gruppe pr. haendelse: en review-koersel maa aldrig aflyse den
  # push-koersel den er sat i verden for at genstarte (maalt 2/9 08:02:02:
  # godkendelsen aflyste dommen).
  group: porten-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  porten:
    # S579 (2/9, Stevens screenshot): GitHub grupperer checks pr. NAVN +
    # HAENDELSE. En groen «porten (pull_request_review)» erstatter ikke en
    # roed «porten (pull_request)» — den staar ved siden af, og den roede
    # er stadig paakraevet. Derfor hedder kun push-koerslen «porten»;
    # review-koerslen doemmer ikke selv, den GENSTARTER push-koerslen, saa
    # dommen lander i det check der faktisk kraeves.
    name: ${{ github.event_name == 'pull_request_review' && 'porten-vaekning' || 'porten' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # S565 · MÅLT: den hentede før Bygmedai/.github på tværs af repoer. GITHUB_TOKEN
      # rækker kun til sit eget repo, så hvert kald døde med «repository not found».
      # Alternativet var at give hvert repo et token med læseadgang til .github —
      # altså at sprede en nøgle for at læse en fil. Porten bor nu i repoet selv,
      # lagt der af installeren og signeret, så den kan opdateres ét sted og
      # udrulles derfra. Sideeffekt: den virker også på public repoer, som slet
      # ikke må kalde reusable workflows fra et privat .github.
      # F1 (præmortem inkandart#178): uden ref hentede den PR'ens MERGEDE træ —
      # altså den anklagedes egen kode. En PR kunne udskifte .porten/porten.mjs
      # med et stub der altid siger ÅBEN, og porten ville køre det stub.
      # Dommeren hentes nu fra kalderens default-branch, som findes på både
      # pull_request og check_suite. En PR der ændrer porten selv rammer
      # LAASTE_STIER og kræver et menneskes merge — det er den rigtige vej.
      # S579 (2/9): «et menneskes merge» er nu en MÅLING, ikke en evig rød:
      # en godkendelse på netop head-sha fra en konto på allowlisten i
      # scripts/porten-frigivelse.mjs — hentet herfra, fra default-branch,
      # så PR'en ikke kan skrive sig selv ind — gør porten grøn. Kun
      # låst-sti-grunden frigives; en rød check kan ingen godkendelse løfte.
      - name: Hent dommeren fra default-branch — aldrig fra PR'ens træ
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Porten skal findes — manglende port er ikke en åben port
        run: |
          test -f .porten/porten.mjs || { echo "::error::.porten/porten.mjs mangler. Kør installeren."; exit 1; }
          test -f .porten/porten.test.mjs || { echo "::error::.porten/porten.test.mjs mangler."; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }

      - name: Selvtest — porten skal bevise sig selv før den dømmer andre
        run: node .porten/porten.test.mjs

      - name: Saml kendsgerninger og fæld dom
        id: dom
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // --- review-haendelse: doem ikke her — genstart push-koerslen (S579) ---
            //
            // Dommen SKAL falde i «porten (pull_request)»: det er den GitHub
            // kraever, og en groen tvilling fra en anden haendelse loefter den
            // ikke (Stevens screenshot 2/9 08:11). Vi finder den seneste
            // push-koersel paa netop dette head og genstarter dens fejlede job.
            // Den laeser reviews naar den doemmer, ser godkendelsen, og
            // skriver sin egen kvittering. Er den stadig i gang, naar den
            // selv at se godkendelsen — saa roerer vi den ikke.
            if (context.eventName === 'pull_request_review') {
              const pr = context.payload.pull_request;
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'porten.yml', event: 'pull_request',
                head_sha: pr.head.sha, per_page: 5,
              });
              const koersel = (data.workflow_runs ?? [])[0];
              if (!koersel) { core.info(`Ingen push-koersel af porten paa ${pr.head.sha.slice(0, 7)} — intet at genstarte.`); return; }
              if (koersel.status !== 'completed') { core.info(`Push-koerslen ${koersel.id} er stadig i gang — den ser selv godkendelsen.`); return; }
              if (koersel.conclusion === 'success') { core.info(`Push-koerslen ${koersel.id} er allerede groen.`); return; }
              await github.rest.actions.reRunWorkflowFailedJobs({ ...context.repo, run_id: koersel.id });
              core.info(`Genstartede push-koerslen ${koersel.id} paa ${pr.head.sha.slice(0, 7)} efter review fra @${context.payload.review?.user?.login ?? '?'}.`);
              return;
            }

            const { porten, kvittering, AABEN, LAASTE_STIER } = await import(`${process.env.GITHUB_WORKSPACE}/.porten/porten.mjs`);

            // S566 · MÅLT (bygmedai-adskillelse 20/8): check_suite-hændelser bærer
            // ingen payload.pull_request — porten fejlede dér med «Ingen PR i
            // konteksten» og GEN-DØMTE derfor aldrig en PR efter at dens checks
            // var færdige. Dommen faldt kun ved open/synchronize, dvs. FØR de
            // påkrævede checks kunne have rapporteret: «har ikke rapporteret» på
            // hver PR, for evigt. PR'erne opløses nu fra check_suite.pull_requests
            // (samme-repo-branches; en fork-suite bærer tom liste og dømmes ikke).
            const maal = [];
            if (context.payload.pull_request) {
              maal.push(context.payload.pull_request);
            } else {
              for (const p of context.payload.check_suite?.pull_requests ?? []) {
                const { data } = await github.rest.pulls.get({ ...context.repo, pull_number: p.number });
                if (data.state === 'open') maal.push(data);
              }
            }
            if (!maal.length) { core.info('Ingen åben PR knyttet til hændelsen — intet at dømme.'); return; }

            // Fristen deles på tværs af alle PRs i denne kørsel — to PRs à 12 min
            // ville ellers sprænge jobbets eget loft og dræbe dommen.
            const FRIST_MS = 12 * 60 * 1000;
            const t0 = Date.now();

            // Én dom per tilknyttet PR (indrykning bevaret for læsbar diff).
            for (const pr of maal) {

            // F3 (præmortem inkandart#178): anmelder-blokken blev læst fra
            // ENHVER check-run — en selvinstalleret app kunne levere sin egen
            // frikendelse. Kun udførende anmeldere paa allowlisten høres.
            const TILLADTE_ANMELDERE = ['Vercel Agent Review'];

            // --- checks: struktureret, ikke tekstsøgt ---
            //
            // S569 · MÅLT (inkandart#186): porten dømte et ØJEBLIK og ramte
            // næsten altid «CI kører stadig». check_suite gen-dømte bagefter og
            // rettede KOMMENTAREN til «åben» — men den kørsel hører til
            // default-branchens SHA og kan ikke røre PR'ens egen check-run.
            // Resultatet: kvitteringen sagde ÅBEN mens check-run'en stod rød,
            // for evigt. Som påkrævet tjek ville porten dermed blokere præcis
            // de PRs den selv havde erklæret åbne.
            //
            // Derfor venter porten nu på at fakta ER fakta, og fælder ÉN dom.
            // Fristen er et loft, ikke en forventning: udløber den, dømmes der
            // på det der foreligger — og et påkrævet tjek der ikke har
            // rapporteret er stadig SPÆRRET. Ventetid kan aldrig blive til et ja.
            const PULS_MS = 15 * 1000;
            let runs, statuser, checks;
            for (;;) {
              runs = await github.paginate(github.rest.checks.listForRef, {
                ...context.repo, ref: pr.head.sha, per_page: 100,
              });
              statuser = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                ...context.repo, ref: pr.head.sha, per_page: 100,
              });
              checks = [
                ...runs.map(r => ({ navn: r.name, status: r.status, konklusion: r.conclusion })),
                ...statuser.map(s => ({ navn: s.context, status: 'completed',
                  konklusion: s.state === 'success' ? 'success' : s.state })),
              ].filter(c => c.navn !== 'porten');   // porten dømmer ikke sig selv

              const paakraevedeNavne = `check,Scan for secrets`.split(',').map(x => x.trim()).filter(Boolean);
              const venterPaaCheck = paakraevedeNavne.filter((n) => {
                const alle = checks.filter((c) => c.navn === n);
                return alle.length === 0 || alle.some((c) => c.status !== 'completed');
              });
              // Anmelderen ventes der kun på hvis den FAKTISK er startet. Er den
              // slet ikke til stede, er fraværet selv dommen — og den er rød.
              const venterPaaAnmelder = runs
                .filter((r) => TILLADTE_ANMELDERE.includes(r.name) && r.status !== 'completed')
                .map((r) => r.name);

              if (!venterPaaCheck.length && !venterPaaAnmelder.length) break;
              if (Date.now() - t0 > FRIST_MS) {
                core.warning(`Frist udløbet efter ${Math.round((Date.now() - t0) / 1000)}s. Venter stadig på: ${[...venterPaaCheck, ...venterPaaAnmelder].join(', ')}. Dømmer på det der foreligger.`);
                break;
              }
              core.info(`Venter på: ${[...venterPaaCheck, ...venterPaaAnmelder].join(', ')} (${Math.round((Date.now() - t0) / 1000)}s)`);
              await new Promise((r) => setTimeout(r, PULS_MS));
            }

            // --- filer ---
            let filer = null;
            try {
              filer = (await github.paginate(github.rest.pulls.listFiles,
                { ...context.repo, pull_number: pr.number, per_page: 100 })).map(f => f.filename);
            } catch (e) { core.warning(`Filliste utilgængelig: ${e.message}`); }

            // --- er forfatteren en agent? ---
            const fragmenter = `claude,haruki,vilde,renovate,dependabot,[bot]`.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
            const login = (pr.user?.login ?? '').toLowerCase();
            const forfatterErAgent = pr.user?.type === 'Bot' || fragmenter.some(f => login.includes(f));

            // --- anmelderdom: maskinlæsbar blok, aldrig fritekst ---
            // Format: en check-run hvis output.text indeholder <!-- porten-alvor: {"normal":0,"nit":2} -->
            let anmeldelse = null;
            for (const r of runs) {
              if (!TILLADTE_ANMELDERE.includes(r.name)) continue;
              const t = r.output?.text ?? '';
              const m = /<!--\s*porten-alvor:\s*(\{.*?\})\s*-->/s.exec(t);
              if (!m) continue;
              try {
                const alvor = JSON.parse(m[1]);
                anmeldelse = { kilde: r.name, alvor };
                break;
              } catch (e) { core.warning(`Anmelder «${r.name}» sendte ugyldig JSON: ${e.message}`); }
            }

            // --- forhåndsvisning ---
            let forhaandsvisning = null;
            const depl = await github.rest.repos.listDeployments({ ...context.repo, sha: pr.head.sha, per_page: 20 }).catch(() => null);
            for (const d of depl?.data ?? []) {
              const st = await github.rest.repos.listDeploymentStatuses({ ...context.repo, deployment_id: d.id, per_page: 5 });
              const ok = st.data.find(s => s.state === 'success' && s.environment_url);
              if (ok) { forhaandsvisning = ok.environment_url; break; }
            }

            const paakraevede = `check,Scan for secrets`.split(',').map(s => s.trim()).filter(Boolean);
            // F5: dependabot-banen kræver positivt bevist afsender, ikke kun stier.
            // En package.json-only PR fra hvem som helst kunne før gå udenom
            // anmelderen med en postinstall i lasten.
            const erDependabot = pr.user?.login === 'dependabot[bot]' && pr.user?.type === 'Bot';
            const resultat = porten({ checks, paakraevede, filer, forfatterErAgent, erDependabot, anmeldelse, forhaandsvisning });

            // --- laast sti: frigivet af et menneskes godkendelse? (S579, 2/9) ---
            //
            // Dommeren siger «kraever et menneskes merge» og kan ikke selv se en
            // godkendelse. Indtil 2/9 var det en port der ALDRIG blev groen —
            // og en port der er roed EFTER mennesket har gjort det den bad om,
            // laerer folk at merge hen over roedt.
            //
            // F4 (praemortem #178) gaelder stadig: ikke «ligner et menneske»,
            // men en ALLOWLISTE af navngivne konti. Listen og reglerne ligger i
            // scripts/porten-frigivelse.mjs, hentet fra DEFAULT-BRANCH som
            // dommeren selv — saa en PR kan ikke skrive sig selv ind i den.
            // Godkendelsen skal sidde paa netop dette commit; et push bagefter
            // goer den vaerdiloes igen. Kun laast-sti-grunden fjernes. En roed
            // check kan ingen godkendelse frigive.
            let endelig = resultat;
            const ramt = (filer ?? []).filter((f) => LAASTE_STIER.some((m) => m.test(f)));
            if (ramt.length && resultat.dom !== AABEN) {
              // MÅLT 2/9 på #290 selv: scriptet fandtes ikke på main endnu, importen
              // kastede ERR_MODULE_NOT_FOUND, og porten døde UDEN kvittering. Rødt,
              // men ulæseligt. Kan frigivelsen ikke indlæses, står dommen som den
              // er (låst sti spærrer stadig) — og noten siger hvorfor der ikke
              // blev låst op. Fail-closed skal kunne læses på PR'en.
              try {
                const { frigivelse, anvendFrigivelse } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/porten-frigivelse.mjs`);
                const reviews = await github.paginate(github.rest.pulls.listReviews,
                  { ...context.repo, pull_number: pr.number, per_page: 100 }).catch(() => []);
                const fri = frigivelse({ reviews, headSha: pr.head.sha, forfatter: pr.user?.login });
                endelig = anvendFrigivelse(resultat, { fri, ramt, headSha: pr.head.sha, AABEN });
              } catch (e) {
                core.warning(`Frigivelse kunne ikke indlæses: ${e.message}`);
                endelig = { ...resultat, noter: [...(resultat.noter ?? []),
                  `Låst sti kunne ikke frigives: scripts/porten-frigivelse.mjs kunne ikke indlæses fra default-branch (${e.code ?? e.name}). Dommen står.`] };
              }
            }

            // --- én kvittering per PR, redigeret på stedet (S564 F4: ti domme på ti pushes) ---
            const MAERKE = '<!-- bygmedai-porten -->';
            const krop = `${MAERKE}\n${kvittering(endelig)}`;
            const eksisterende = (await github.paginate(github.rest.issues.listComments,
              { ...context.repo, issue_number: pr.number, per_page: 100 }))
              .find(c => c.body?.startsWith(MAERKE));
            if (eksisterende) await github.rest.issues.updateComment({ ...context.repo, comment_id: eksisterende.id, body: krop });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body: krop });

            core.summary.addRaw(kvittering(endelig)).write();
            if (endelig.dom !== AABEN) core.setFailed(`PR #${pr.number}: Porten er spærret: ${endelig.grunde.length} grund(e).`);
            }   // for (const pr of maal)
