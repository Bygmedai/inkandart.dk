# Dependabot auto-merge (caller, S460 migration)
#
# Calls reusable workflow from Bygmedai/.github @v1. Bounded patch-only auto-merge:
# only version-update:semver-patch from dependabot[bot] is auto-approved + merged.
# Major + minor remain human-review.
#
# Authority: AMENDMENT-S459-VENDOR-SECURITY-CARVEOUT-v1.0 §Q3 (bounded patch auto-merge).
#
# To update auto-merge logic: edit Bygmedai/.github reusable workflow + bump tag.

name: Dependabot auto-merge
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # S549: job-level if fjernet — eneste diff fra de 10 virkende callers, og
    # workflowen har fejlet paa startup (0 jobs, tom log) siden foer S549.
    # Den reusable workflow gater selv paa dependabot[bot] internt.
    uses: Bygmedai/.github/.github/workflows/dependabot-auto-merge.yml@v1
    # S549: reusable workflows arver IKKE secrets automatisk (GitHub docs) —
    # uden inherit naar DEPENDABOT_AUTOMERGE_TOKEN aldrig frem, og approval falder
    # tilbage til github-actions[bot], som ikke er code-owner -> PR blokeret for evigt.
    secrets: inherit
