name: CI

on:
  pull_request:
    # Rummet bygges i en stak: haruki/* -> rummet-m2 -> rummet-m1 -> main.
    # Kørte CI kun mod main, ville 'check' aldrig blive postet paa de
    # stablede PR'er — og Porten, der kraever 'check', spaerrede dem
    # fail-closed efter 721s ventetid. Derfor skal integrationsgrenene med.
    branches: [main, rummet-m1, rummet-m2]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
