# Leverancevagt — ser om husets breve rent faktisk kom frem.
#
# Et 2xx fra Resend betyder «accepteret til afsendelse», ikke «landet».
# Fail-closed i /api/samtykke fanger ikke en bounce hos modtageren.
# Acceptkriterier: docs/accept/leverancevagt.md
#
# Én gang i doegnet er et VALG: hyppigere ville koste kald uden at aendre
# hvad nogen kan naa at goere. Sonja laeser ikke en rapport kl. tre om
# natten.
#
# Kendt begraensning, samme som kundevagten: GitHub slaar cron fra efter
# 60 dages repo-stilhed. Fravaeret af koersler er derfor ogsaa et signal.
name: Leverancevagt
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leverance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # LAESE-noeglen. Den der sendes med i /api/samtykke er sending-only
      # og laast til ét domaene — den maa ALDRIG staa her.
      #
      # Her stod indtil 1/9 en advarsel: «saet ikke hemmeligheden foer
      # teamet er skilt ad». Grunden var rigtig — Resend har kun
      # full_access og sending_access, saa enhver noegle der kan LAESE er
      # en hovednoegle til hele sit team, og teamet blev delt med andre
      # kunder. Haruki skilte teamet ad samme dag.
      #
      # Advarslen er vaek, fordi den var en aftale i hukommelsen. Den
      # holdt indtil den blev opfyldt, og den ville ikke holde naar nogen
      # om et halvt aar roterer noeglen i en fart. Betingelsen er nu en
      # MAALING: vagten spoerger Resend hvad noeglen raekker over, og
      # stopper foer den henter ét brev hvis den ser et domaene der ikke
      # er husets.
      #
      # Saa saet hemmeligheden — en laesenoegle fra det team der KUN
      # rummer huset. Er den for bred, siger vagten det selv.
      #
      # Uden hemmeligheden fejler vagten AABENT. Foerste koersel: start
      # den i haanden (workflow_dispatch) i stedet for at vente paa 07:17.
      - run: node scripts/leverancevagt.mjs
        env:
          RESEND_READ_KEY: ${{ secrets.RESEND_READ_KEY }}
