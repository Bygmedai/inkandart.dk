# Decap CMS — Rummet content. GitHub backend via oauth.bygmedai.dk.
backend:
  name: github
  repo: Bygmedai/inkandart.dk
  branch: main
  base_url: https://oauth.bygmedai.dk
publish_mode: simple

media_folder: public/slots
public_folder: /slots

locale: da

collections:
  - name: artists
    label: Artister
    label_singular: Artist
    folder: content
    filter: { field: id, exists: true }
    format: yml
    extension: yml
    create: false
    delete: false
    identifier_field: id
    files:
      - label: Artister
        name: artists
        file: content/artists.yml
        fields:
          - label: Artister
            name: artists
            widget: list
            fields:
              - { label: Id, name: id, widget: string }
              - { label: Fornavn, name: fornavn, widget: string }
              - { label: Håndværk, name: haandvaerk, widget: string, required: false }
              - { label: Periode, name: periode, widget: select, options: [fast, gaest] }
              - { label: I huset til, name: periode_til, widget: string, required: false }
              - { label: Foto, name: foto, widget: image }
              - { label: Billedtekst, name: billedtekst, widget: string, required: false, hint: "Motiv og teknik. Ikke en titel." }
              - { label: Aktiv, name: aktiv, widget: boolean, default: true }
              - { label: Sidder i stolen, name: stol, widget: boolean, default: true }
              - { label: Kan bookes, name: booking, widget: boolean, default: true, hint: "Fra = kortet siger walk-in. Tænd når Book.dk-kalenderen er sat op." }
              - { label: Bio, name: bio, widget: text, required: false, hint: "Artistens egne ord. Tom = linjen udelades. Skriv aldrig en bio for et menneske der ikke selv har skrevet den." }
              - { label: Instagram, name: instagram, widget: string, required: false, hint: "Handle uden @. Tom = linjen udelades." }

  - name: vaerker
    label: Værker
    files:
      - label: Værker
        name: vaerker
        file: content/vaerker.yml
        fields:
          - label: Værker
            name: vaerker
            widget: list
            fields:
              - { label: Slot / id, name: id, widget: string }
              - { label: Titel, name: titel, widget: string, required: false, hint: "Tom = untitled. Opdigt aldrig en titel." }
              - { label: Artist-id, name: artist, widget: string, hint: "nizar / emma / gaest" }
              - { label: År, name: aar, widget: string, required: false }
              - { label: Arkivnr, name: arkivnr, widget: string, required: false }
              - { label: Foto, name: foto, widget: image }
              - { label: Billedtekst, name: billedtekst, widget: string, required: false, hint: "Motiv og teknik. Ikke en titel." }
              - { label: Må vises, name: maa_vises, widget: boolean, default: true }
              - { label: DEMO, name: demo, widget: boolean, default: false, hint: "Chip vises ikke. Feltet bliver i YAML." }
              - { label: Værket i dag, name: i_dag, widget: boolean, default: false }
              - { label: Edition-ref, name: edition_ref, widget: string, required: false, hint: "Shopify product handle, not GID. From the admin URL, e.g. sort-hjort-hoodie." }

  - name: nat
    label: Natten
    files:
      - label: Natten
        name: nat
        file: content/nat.yml
        fields:
          - label: Nætter
            name: nat
            widget: list
            fields:
              - { label: Nr, name: nr, widget: string, required: false }
              - { label: Dato, name: dato, widget: string, required: false }
              - { label: Navne, name: navne, widget: list, required: false }
              - { label: Tidsrum, name: tidsrum, widget: string, required: false }
              - { label: Plakat, name: plakatfoto, widget: image, required: false }
              - { label: Billedtekst, name: billedtekst, widget: string, required: false, hint: "Motiv og teknik." }
              - { label: Aktiv i aften, name: aktiv, widget: boolean, default: false }

  - name: huset
    label: Forsiden
    files:
      - label: Forsiden
        name: huset
        file: content/huset.yml
        fields:
          - { label: Titel, name: titel, widget: string }
          - { label: Lede, name: lede, widget: text }
          - { label: Book-knappens tekst, name: cta_book, widget: string, default: "Book tid" }
          - { label: Hero-foto, name: hero_foto, widget: image, hint: "Forsidens store billede. Seglet lægger sig ovenpå — vælg et motiv der tåler det." }
          - { label: Hero-billedtekst, name: hero_billedtekst, widget: string, hint: "Sig hvad man ser. Bliver billedets alt-tekst." }
          - { label: Kicker, name: kicker, widget: string, required: false, hint: "Lille etiket i heroens hjørne. Tom = ingen." }

  - name: kontakt
    label: Kontakt & stamdata
    files:
      - label: Kontakt & stamdata
        name: kontakt
        file: content/kontakt.yml
        fields:
          - { label: Firmanavn, name: navn, widget: string }
          - { label: CVR, name: cvr, widget: string }
          - { label: Adresse, name: adresse, widget: string }
          - { label: By, name: by, widget: string }
          - { label: "Telefon (som det vises)", name: telefon_vist, widget: string }
          - { label: "Telefon (E.164, +45...)", name: telefon_e164, widget: string, pattern: ["^\\+45\\d{8}$", "Skal være +45 fulgt af 8 cifre"] }
          - { label: Booking-mail, name: email, widget: string, pattern: ["@", "Skal være en mailadresse"] }

  - name: gaden
    label: Gaden
    files:
      - label: Gaden
        name: gaden
        file: content/gaden.yml
        fields:
          - { label: Åbningstider, name: aabent, widget: string, required: false, hint: "Tom = linjen udelades. Opdigt aldrig tider." }
          - { label: Walk-in-tider, name: walk_in, widget: string, required: false, hint: "Tom = linjen udelades." }
          - { label: Billedtekst, name: billedtekst, widget: string, required: false }

  - name: booking
    label: Booking-siden
    files:
      - label: Booking-siden
        name: booking
        file: content/booking.yml
        fields:
          - { label: Lede, name: lede, widget: text }
          - { label: Depositum-knappens tekst, name: depositum_label, widget: string, hint: "Beløbet skal matche Shopify-produktet." }
          - { label: Book.dk-knappens tekst, name: door_label, widget: string, default: "Videre til booking" }
          - { label: Note, name: note, widget: text, required: false }
          - { label: Foto, name: foto, widget: image }
          - { label: Billedtekst, name: billedtekst, widget: string }

  - name: natten_side
    label: Nattens side
    files:
      - label: Nattens side
        name: natten_side
        file: content/natten.yml
        fields:
          - { label: Intro, name: intro, widget: text, hint: "Hvad Natten ER, for en der aldrig har hørt om den." }
          - { label: Tom-tilstandens titel, name: tom_titel, widget: string, default: "Ingen nat i aften" }
          - { label: Tom-tilstandens linje, name: tom_linje, widget: string, required: false }

  - name: betingelser
    label: Betingelser
    files:
      - label: Betingelser (dansk)
        name: betingelser_da
        file: content/betingelser.yml
        fields:
          - { label: Titel, name: titel, widget: string }
          - { label: Lede, name: lede, widget: text }
          - label: Sektioner
            name: sektioner
            widget: list
            fields:
              - { label: Overskrift, name: overskrift, widget: string }
              - { label: Tekst, name: tekst, widget: text }
      - label: Terms (English)
        name: betingelser_en
        file: content/betingelser.en.yml
        fields:
          - { label: Titel, name: titel, widget: string }
          - { label: Lede, name: lede, widget: text }
          - label: Sektioner
            name: sektioner
            widget: list
            fields:
              - { label: Overskrift, name: overskrift, widget: string }
              - { label: Tekst, name: tekst, widget: text }
