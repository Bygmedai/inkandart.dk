# HUSETS INDHOLDS-KONTRAKT
#
# Hvad et menneske skal kunne rette UDEN en agent og UDEN at røre kode.
#
# Filen startede som Decaps `config.yml` og lå på `public/admin/`. Decap er
# pensioneret (Sirius, CMS-RULING-01, 31/8): en eval-kapabel JavaScript-app
# og en GitHub-skrivetoken på samme origin som kundesitet er den forkerte
# magtgrænse. `/admin` svarer nu 410.
#
# Filen bliver stående her, fordi LISTEN stadig er sand. Felterne herunder
# er dem huset skal kunne redigere; kun redigeringsfladen skifter. Når
# HOUSE-CMS-01 flytter dem til Shopify-metaobjects, skal denne fil
# erstattes af den Shopify-kontrakt — ikke bare slettes, og ikke blive
# stående som en grøn prøve der ikke måler noget.
#
# Testene der læser filen vogter én ting: at koden ikke begynder at læse en
# content-fil som intet menneske kan redigere. Den vagt gælder uændret.
#
# Villy, S576.

# Decap CMS — Rummet content. GitHub backend via oauth.bygmedai.dk.
backend:
  name: github
  repo: Bygmedai/inkandart.dk
  branch: main
  base_url: https://oauth.bygmedai.dk
publish_mode: simple

media_folder: public/slots
public_folder: /slots

locale: da

collections:
  - name: artists
    label: Artister
    label_singular: Artist
    folder: content
    filter: { field: id, exists: true }
    format: yml
    extension: yml
    create: false
    delete: false
    identifier_field: id
    files:
      - label: Artister
        name: artists
        file: content/artists.yml
        fields:
          - label: Artister
            name: artists
            widget: list
            fields:
              - { label: Id, name: id, widget: string }
              - { label: Fornavn, name: fornavn, widget: string }
              - { label: Håndværk, name: haandvaerk, widget: string, required: false }
              - { label: Periode, name: periode, widget: select, options: [fast, gaest] }
              - { label: I huset til, name: periode_til, widget: string, required: false }
              - { label: Foto, name: foto, widget: image }
              - { label: Billedtekst, name: billedtekst, widget: string, required: false, hint: "Motiv og teknik. Ikke en titel." }
              - { label: Aktiv, name: aktiv, widget: boolean, default: true }
              - { label: Sidder i stolen, name: stol, widget: boolean, default: true }
              - { label: Kan bookes, name: booking, widget: boolean, default: true, hint: "Fra = kortet siger walk-in. Tænd når Book.dk-kalenderen er sat op." }
              - { label: Bio, name: bio, widget: text, required: false, hint: "Artistens egne ord. Tom = linjen udelades. Skriv aldrig en bio for et menneske der ikke selv har skrevet den." }
              - { label: "Håndværk (engelsk)", name: haandvaerk_en, widget: string, required: false, hint: "Fagets navn på engelsk. Tom = den danske linje vises." }
              - { label: "Bio (engelsk)", name: bio_en, widget: text, required: false, hint: "Artistens EGEN engelske tekst. Tom = den danske bio vises som dansk. Oversæt aldrig en bio for dem." }
              - { label: Instagram, name: instagram, widget: string, required: false, hint: "Handle uden @. Tom = linjen udelades." }
              # Galleri-slots (Villy, S575 — docs/accept/galleri.md).
              # max: 4 er loftet HVOR REDAKTOEREN KAN SE DET. Koden har det
              # samme loft (GALLERI_MAX = 5, portraettet talt med), men en
              # tavs afkortning er en loegn — her bliver hun stoppet i stedet.
              - label: "Flere billeder"
                name: fotos
                widget: list
                required: false
                max: 4
                summary: "{{fields.tekst}}"
                hint: "Ekstra billeder til artistens side. Ét ekstra er nok: så begynder billederne at skifte af sig selv. Max fire — portrættet ovenfor er det femte."
                fields:
                  - { label: Billede, name: fil, widget: image }
                  - { label: Billedtekst, name: tekst, widget: string, required: false, hint: "Hvad ser man? Dine ord — vi oversætter dem ikke." }
                  - { label: Fokuspunkt, name: fokus, widget: string, required: false, hint: "Kun hvis motivet beskæres skævt. Fx «72% 30%» rykker udsnittet mod højre og op. Tom = midten." }

  - name: vaerker
    label: Værker
    files:
      - label: Værker
        name: vaerker
        file: content/vaerker.yml
        fields:
          - label: Værker
            name: vaerker
            widget: list
            fields:
              - { label: Slot / id, name: id, widget: string }
              - { label: Titel, name: titel, widget: string, required: false, hint: "Tom = untitled. Opdigt aldrig en titel." }
              - { label: Artist-id, name: artist, widget: string, hint: "nizar / emma / gaest" }
              - { label: År, name: aar, widget: string, required: false }
              - { label: Arkivnr, name: arkivnr, widget: string, required: false }
              - { label: Foto, name: foto, widget: image }
              - { label: Billedtekst, name: billedtekst, widget: string, required: false, hint: "Motiv og teknik. Ikke en titel." }
              - { label: Må vises, name: maa_vises, widget: boolean, default: true }
              - { label: DEMO, name: demo, widget: boolean, default: false, hint: "Chip vises ikke. Feltet bliver i YAML." }
              - { label: Værket i dag, name: i_dag, widget: boolean, default: false }
              - { label: Edition-ref, name: edition_ref, widget: string, required: false, hint: "Shopify product handle, not GID. From the admin URL, e.g. sort-hjort-hoodie." }

  - name: nat
    label: Natten
    files:
      - label: Natten
        name: nat
        file: content/nat.yml
        fields:
          - label: Nætter
            name: nat
            widget: list
            fields:
              - { label: Nr, name: nr, widget: string, required: false }
              - { label: Dato, name: dato, widget: string, required: false }
              - { label: Navne, name: navne, widget: list, required: false }
              - { label: Tidsrum, name: tidsrum, widget: string, required: false }
              - { label: Plakat, name: plakatfoto, widget: image, required: false }
              - { label: Billedtekst, name: billedtekst, widget: string, required: false, hint: "Motiv og teknik." }
              - { label: Aktiv i aften, name: aktiv, widget: boolean, default: false }

  - name: huset
    label: Forsiden
    files:
      - label: Forsiden
        name: huset
        file: content/huset.yml
        fields:
          - { label: Titel, name: titel, widget: string }
          - { label: Lede, name: lede, widget: text }
          - { label: Åbningstider, name: tider, widget: string, required: false, hint: "Vises i folden. Tom = udelades." }
          - { label: Book-knappens tekst, name: cta_book, widget: string, default: "Book tid" }
          - { label: Hero-foto, name: hero_foto, widget: image, hint: "Forsidens store billede. Seglet lægger sig ovenpå — vælg et motiv der tåler det." }
          - { label: Hero-billedtekst, name: hero_billedtekst, widget: string, hint: "Sig hvad man ser. Bliver billedets alt-tekst." }
          - { label: Kicker, name: kicker, widget: string, required: false, hint: "Lille etiket i heroens hjørne. Tom = ingen." }

  - name: kontakt
    label: Kontakt & stamdata
    files:
      - label: Kontakt & stamdata
        name: kontakt
        file: content/kontakt.yml
        fields:
          - { label: Firmanavn, name: navn, widget: string }
          - { label: CVR, name: cvr, widget: string }
          - { label: Adresse, name: adresse, widget: string }
          - { label: By, name: by, widget: string }
          - { label: "Telefon (som det vises)", name: telefon_vist, widget: string }
          - { label: "Telefon (E.164, +45...)", name: telefon_e164, widget: string, pattern: ["^\\+45\\d{8}$", "Skal være +45 fulgt af 8 cifre"] }
          - { label: Booking-mail, name: email, widget: string, pattern: ["@", "Skal være en mailadresse"] }
          - { label: Instagram, name: instagram, widget: string, required: false, hint: "Husets handle uden @." }

  - name: gaden
    label: Gaden
    files:
      - label: Gaden (dansk)
        name: gaden
        file: content/gaden.yml
        fields:
          - { label: Titel, name: titel, widget: string }
          - { label: "Åbent — etiket", name: aabent_label, widget: string, required: false }
          - { label: Åbningstider, name: aabent, widget: string, required: false, hint: "Tom = linjen udelades. Opdigt aldrig tider." }
          - { label: "Walk-in — etiket", name: walk_in_label, widget: string, required: false }
          - { label: Walk-in-tider, name: walk_in, widget: string, required: false, hint: "Tom = linjen udelades." }
          - { label: Depositum-linje, name: depositum_linje, widget: string, required: false }
          - { label: Fag-linje, name: fag_linje, widget: string, required: false }
          - { label: Foto, name: foto, widget: image }
          - { label: Billedtekst, name: billedtekst, widget: string, required: false }
      - label: The street (English)
        name: gaden_en
        file: content/gaden.en.yml
        fields:
          - { label: Titel, name: titel, widget: string, hint: "Rummets navn oversættes ikke." }
          - { label: "Åbent — etiket", name: aabent_label, widget: string, required: false }
          - { label: Åbningstider, name: aabent, widget: string, required: false }
          - { label: "Walk-in — etiket", name: walk_in_label, widget: string, required: false }
          - { label: Walk-in-tider, name: walk_in, widget: string, required: false }
          - { label: Depositum-linje, name: depositum_linje, widget: string, required: false }
          - { label: Fag-linje, name: fag_linje, widget: string, required: false }
          - { label: Foto, name: foto, widget: image }
          - { label: Billedtekst, name: billedtekst, widget: string, required: false }

  - name: aftercare
    label: Aftercare
    files:
      - label: Aftercare (dansk)
        name: aftercare_da
        file: content/aftercare.yml
        fields: &aftercare_felter
          - { label: Etiket, name: file, widget: string }
          - { label: Titel, name: titel, widget: string }
          - { label: Lead, name: lead, widget: text }
          - { label: "Tatovering — overskrift", name: tattoo_titel, widget: string }
          - { label: "Piercing — overskrift", name: piercing_titel, widget: string }
          - label: Tatovering-trin
            name: tattoo
            widget: list
            hint: "Numrene sættes af siden. Skriv et trin ind eller ud uden at rette rækkefølgen."
            fields:
              - { label: Overskrift, name: t, widget: string }
              - { label: Tekst, name: d, widget: text }
          - label: Piercing-trin
            name: piercing
            widget: list
            fields:
              - { label: Overskrift, name: t, widget: string }
              - { label: Tekst, name: d, widget: text }
          - { label: "I tvivl — etiket", name: tvivl_label, widget: string }
          - { label: "I tvivl — tekst", name: tvivl, widget: text }
          - { label: WhatsApp-knappens tekst, name: skriv_cta, widget: string }
      - label: Aftercare (English)
        name: aftercare_en
        file: content/aftercare.en.yml
        fields: *aftercare_felter

  - name: booking
    label: Booking-siden
    files:
      - label: Booking-siden
        name: booking
        file: content/booking.yml
        fields:
          - { label: Lede, name: lede, widget: text }
          - { label: Konsultation, name: konsultation, widget: text, required: false, hint: "Linjen om den gratis konsultation. Tom = udelades." }
          - { label: Depositum-knappens tekst, name: depositum_label, widget: string, hint: "Beløbet skal matche Shopify-produktet." }
          - { label: "Trin 1 — bookingen", name: book_trin, widget: text, required: false, hint: "Én sætning om hvad kunden gør i Book.dk. Står over knappen." }
          - { label: Book.dk-knappens tekst, name: door_label, widget: string, default: "Videre til booking" }
          - { label: Note, name: note, widget: text, required: false }
          - { label: "Trin 2 — depositum", name: depositum_trin, widget: text, required: false, hint: "Kun for de lange sessioner. Kunden skal IKKE skrive et ordrenummer — vi afstemmer på mailadressen, som begge systemer allerede har." }
          - { label: "Tjek — overskrift", name: tjek_titel, widget: string, required: false }
          - { label: "Tjek — hjælpetekst", name: tjek_hjaelp, widget: text, required: false }
          - { label: "Tjek — knap", name: tjek_knap, widget: string, required: false }
          - { label: "Svar: betalt", name: svar_betalt, widget: text, required: false }
          - { label: "Svar: ikke betalt endnu", name: svar_ikke_betalt, widget: text, required: false }
          - { label: "Svar: ukendt nummer", name: svar_ukendt, widget: text, required: false }
          - { label: "Svar: ikke et nummer", name: svar_ugyldigt, widget: text, required: false }
          - { label: "Svar: kan ikke slå op", name: svar_kan_ikke_tjekke, widget: text, required: false }
          - { label: Tak-sidens titel, name: tak_titel, widget: string }
          - { label: Tak-sidens betalt-tekst, name: tak_betalt, widget: text, hint: "Må aldrig påstå at betalingen er set af systemet — kvitteringen kommer fra Shopify." }
          - { label: Foto, name: foto, widget: image }
          - { label: Billedtekst, name: billedtekst, widget: string }

      - label: Booking (English)
        name: booking_en
        file: content/booking.en.yml
        fields:
          - { label: Lede, name: lede, widget: text }
          - { label: Konsultation, name: konsultation, widget: text, required: false }
          - { label: Depositum-knappens tekst, name: depositum_label, widget: string, hint: "Beløbet skal matche Shopify-produktet OG den danske side." }
          - { label: "Trin 1 — bookingen", name: book_trin, widget: text, required: false, hint: "Én sætning om hvad kunden gør i Book.dk. Står over knappen." }
          - { label: Book.dk-knappens tekst, name: door_label, widget: string, default: "On to booking" }
          - { label: Note, name: note, widget: text, required: false }
          - { label: "Trin 2 — depositum", name: depositum_trin, widget: text, required: false, hint: "Kun for de lange sessioner. Kunden skal IKKE skrive et ordrenummer — vi afstemmer på mailadressen, som begge systemer allerede har." }
          - { label: "Tjek — overskrift", name: tjek_titel, widget: string, required: false }
          - { label: "Tjek — hjælpetekst", name: tjek_hjaelp, widget: text, required: false }
          - { label: "Tjek — knap", name: tjek_knap, widget: string, required: false }
          - { label: "Svar: betalt", name: svar_betalt, widget: text, required: false }
          - { label: "Svar: ikke betalt endnu", name: svar_ikke_betalt, widget: text, required: false }
          - { label: "Svar: ukendt nummer", name: svar_ukendt, widget: text, required: false }
          - { label: "Svar: ikke et nummer", name: svar_ugyldigt, widget: text, required: false }
          - { label: "Svar: kan ikke slå op", name: svar_kan_ikke_tjekke, widget: text, required: false }
          - { label: Tak-sidens titel, name: tak_titel, widget: string }
          - { label: Tak-sidens betalt-tekst, name: tak_betalt, widget: text }
          - { label: Foto, name: foto, widget: image }
          - { label: Billedtekst, name: billedtekst, widget: string }

  - name: natten_side
    label: Nattens side
    files:
      - label: Nattens side
        name: natten_side
        file: content/natten.yml
        fields:
          - { label: Intro, name: intro, widget: text, hint: "Hvad Natten ER, for en der aldrig har hørt om den." }
          - { label: Tom-tilstandens titel, name: tom_titel, widget: string, default: "Ingen nat i aften" }
          - { label: Tom-tilstandens linje, name: tom_linje, widget: string, required: false }

      - label: Natten (English)
        name: natten_side_en
        file: content/natten.en.yml
        fields:
          - { label: Intro, name: intro, widget: text, hint: "Hvad Natten ER, for en der aldrig har hørt om den." }
          - { label: Tom-tilstandens titel, name: tom_titel, widget: string, default: "Ingen nat i aften" }
          - { label: Tom-tilstandens linje, name: tom_linje, widget: string, required: false }

  - name: betingelser
    label: Betingelser
    files:
      - label: Betingelser (dansk)
        name: betingelser_da
        file: content/betingelser.yml
        fields:
          - { label: Titel, name: titel, widget: string }
          - { label: Lede, name: lede, widget: text }
          - label: Sektioner
            name: sektioner
            widget: list
            fields:
              - { label: Overskrift, name: overskrift, widget: string }
              - { label: Tekst, name: tekst, widget: text }
      - label: Terms (English)
        name: betingelser_en
        file: content/betingelser.en.yml
        fields:
          - { label: Titel, name: titel, widget: string }
          - { label: Lede, name: lede, widget: text }
          - label: Sektioner
            name: sektioner
            widget: list
            fields:
              - { label: Overskrift, name: overskrift, widget: string }
              - { label: Tekst, name: tekst, widget: text }

  - name: privatliv
    label: Privatlivspolitik
    files:
      - label: Privatlivspolitik (dansk)
        name: privatliv_da
        file: content/privatliv.yml
        fields:
          - { label: Titel, name: titel, widget: string }
          - { label: Lede, name: lede, widget: text }
          - label: Sektioner
            name: sektioner
            widget: list
            hint: "Retter du én databehandler her, så ret den også i den engelske. De to sprog må ikke drifte fra hinanden."
            fields:
              - { label: Overskrift, name: overskrift, widget: string }
              - { label: Tekst, name: tekst, widget: text }
      - label: Privacy policy (English)
        name: privatliv_en
        file: content/privatliv.en.yml
        fields:
          - { label: Titel, name: titel, widget: string }
          - { label: Lede, name: lede, widget: text }
          - label: Sektioner
            name: sektioner
            widget: list
            fields:
              - { label: Overskrift, name: overskrift, widget: string }
              - { label: Tekst, name: tekst, widget: text }

  - name: faq
    label: FAQ
    files:
      - label: FAQ (dansk)
        name: faq_da
        file: content/faq.yml
        fields:
          - { label: Titel, name: titel, widget: string }
          - { label: Lede, name: lede, widget: text }
          - label: Spørgsmål
            name: sporgsmal
            widget: list
            fields:
              - { label: Spørgsmål, name: q, widget: string }
              - { label: Svar, name: a, widget: text }
      - label: FAQ (English)
        name: faq_en
        file: content/faq.en.yml
        fields:
          - { label: Titel, name: titel, widget: string }
          - { label: Lede, name: lede, widget: text }
          - label: Spørgsmål
            name: sporgsmal
            widget: list
            fields:
              - { label: Spørgsmål, name: q, widget: string }
              - { label: Svar, name: a, widget: text }
      - label: Den engelske forside
        name: huset_en
        file: content/huset.en.yml
        fields:
          - { label: Titel, name: titel, widget: string }
          - { label: Lede, name: lede, widget: text }
          - { label: Åbningstider, name: tider, widget: string, required: false }
          - { label: Book-knappens tekst, name: cta_book, widget: string }
          - { label: Walk-in-linje, name: walk_in_line, widget: string, required: false }

  - name: piercing
    label: Piercing-teksten
    files:
      - label: Piercing-teksten
        name: piercing
        file: content/piercing.yml
        fields:
          - { label: Titel, name: titel, widget: string }
          - { label: Tekst, name: tekst, widget: text }
          # «Priser» er FJERNET. Piercingprisen er en liste, ikke en
          # sætning — se piercing_priser nedenfor.
          - { label: Foto af smykkeskabet, name: foto, widget: image, required: false, hint: "Tom = ingen ramme paa siden." }
          - { label: Billedtekst, name: billedtekst, widget: string, required: false }

      - label: Piercing (English)
        name: piercing_en
        file: content/piercing.en.yml
        fields:
          - { label: Titel, name: titel, widget: string }
          - { label: Tekst, name: tekst, widget: text }

      # Prislisten. ÉT tal, to navne — så de to sprog ikke kan sige
      # forskellige priser. Sonja skal kunne rette en pris uden at røre
      # GitHub; en prisliste hun ikke selv kan rette, bliver forkert.
      #
      # ⚠ DET KAN HUN IKKE I DAG. Decap er nedlagt (CMS-RULING-01, 31/8),
      # og der findes endnu ingen afløser. Felterne står her, fordi de er
      # den kontrakt HOUSE-CMS-01 skal opfylde — ikke fordi der er en flade
      # at rette dem i. Indtil da går en prisændring gennem en PR.
      - label: Piercingpriser
        name: piercing_priser
        file: content/piercing-priser.yml
        fields:
          - label: Intro
            name: intro
            widget: object
            fields:
              - { label: Dansk, name: da, widget: text }
              - { label: English, name: en, widget: text }
          - label: Prisgrupper
            name: prisgrupper
            widget: list
            fields:
              - label: Gruppe
                name: gruppe
                widget: object
                fields:
                  - { label: Dansk, name: da, widget: string }
                  - { label: English, name: en, widget: string }
              - label: Linjer
                name: linjer
                widget: list
                fields:
                  - { label: Pris i kroner, name: pris, widget: number, value_type: int, min: 1 }
                  - { label: Dansk navn, name: da, widget: string }
                  - { label: English name, name: en, widget: string }
          - label: Tillæg
            name: tillaeg
            widget: list
            fields:
              - { label: Pris i kroner, name: pris, widget: number, value_type: int, min: 1 }
              - { label: Dansk navn, name: da, widget: string }
              - { label: English name, name: en, widget: string }
          - label: Note
            name: note
            widget: object
            fields:
              - { label: Dansk, name: da, widget: text }
              - { label: English, name: en, widget: text }
